name: Deploy AQC Admission V2

on:
  push:
    branches:
      - apps-script-v2-dev
    paths:
      - '.github/workflows/deploy-aqc-v2.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Admission V2 source
        uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0

      - name: Verify clasp credential is configured
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON secret is not configured."
            exit 1
          fi

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify locked V2 target
        run: node tools/verify-clasp-target.mjs

      - name: Syntax-check Admission V2 source
        run: |
          set -e
          for f in apps-script-v2/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Push complete V2 source to Apps Script HEAD
        run: clasp push --force

      - name: Confirm clasp status after push
        run: clasp status
