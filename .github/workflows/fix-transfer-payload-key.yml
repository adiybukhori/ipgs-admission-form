name: Fix transfer applicant payload key

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-transfer-payload-key.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix transfer payload field
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "      payload.transferApplicant = formState.applicationCategory === 'Transfer Student';"
          new = "      payload.isTransferApplicant = formState.applicationCategory === 'Transfer Student';"
          if old not in s:
              raise SystemExit('Old transfer payload key not found; refusing to patch.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Sanity check
        run: |
          grep -q "payload.isTransferApplicant = formState.applicationCategory === 'Transfer Student';" index.html
          ! grep -q "payload.transferApplicant =" index.html
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-transfer-payload-key.yml
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix transfer applicant backend mapping"
          git push origin main
