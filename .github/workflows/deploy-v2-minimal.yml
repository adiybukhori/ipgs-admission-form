name: Deploy Apps Script V2 Minimal

on:
  workflow_dispatch:
  push:
    branches: [apps-script-v2-dev]
    paths:
      - '.github/workflows/deploy-v2-minimal.yml'

permissions:
  contents: write

# SAC direct gateway deployment trigger: 2026-10-01-v2
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0

      - name: Patch protected doPost SAC file fast-path
        run: python3 .github/scripts/patch_sac_direct_gateway.py

      - name: Verify source
        run: |
          node tools/verify-clasp-target.mjs
          node --check apps-script-v2/Code.js
          node --check apps-script-v2/SacPackV2.js
          node --check apps-script-v2/SacPackDirectGatewayV2.js
          grep -F "DIRECT_SAC_PACK_FILE_FAST_PATH" apps-script-v2/Code.js
          grep -F "function v2GetSacPackFileDirect_" apps-script-v2/SacPackDirectGatewayV2.js

      - name: Verify clasp credential exists
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON is missing"
            exit 1
          fi

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp auth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push Apps Script source
        run: clasp push --force

      - name: Redeploy existing web app
        run: clasp create-deployment --deploymentId AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB --description "Direct SAC pack read-only file gateway"

      - name: Commit deployed fast-path back to source branch
        run: |
          git config user.name 'adiybukhori'
          git config user.email 'muhammadadiy93@gmail.com'
          git add apps-script-v2/Code.js apps-script-v2/SacPackDirectGatewayV2.js
          if git diff --cached --quiet; then
            echo 'No source commit required.'
          else
            git commit -m 'Route SAC file fetch through direct V2 gateway'
            git push origin HEAD:apps-script-v2-dev
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.clasprc.json"
