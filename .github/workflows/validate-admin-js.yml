name: Validate Admin JavaScript

on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'orientation-admin.js'
      - 'handover-admin.js'
      - 'fee-structure-admin.js'
      - 'system-guide-training.js'
      - 'system-guide-training-v2.js'
      - 'api/admin-data.js'
      - '.github/workflows/validate-admin-js.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check admin-data API syntax
        run: node --check api/admin-data.js
      - name: Check module JavaScript
        run: |
          node --check orientation-admin.js
          node --check handover-admin.js
          node --check fee-structure-admin.js
          node --check system-guide-training.js
          node --check system-guide-training-v2.js
      - name: Extract and check admin inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('admin.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          if not blocks:
              raise SystemExit('No inline script found')
          Path('/tmp/admin-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/admin-inline.js
