name: Patch Admin V2 Operations UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-operations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Admin V2 operations
        shell: python
        run: |
          from pathlib import Path

          p = Path('admin.html')
          s = p.read_text()

          css = r'''
              .ops-panel{border:1px solid #dcd7ef;background:linear-gradient(135deg,#fbfaff,#fff);border-radius:15px;padding:14px 15px;margin:0 0 16px}
              .ops-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
              .ops-head .title{font-size:12px;font-weight:900;color:var(--purple)}
              .ops-head .state{font-size:10px;font-weight:850;border-radius:999px;padding:5px 8px;background:var(--purpleSoft);color:var(--purple)}
              .ops-copy{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:10px}
              .ops-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
              .ops-btn{border:1px solid #d9d3ef;background:#fff;color:var(--purple);border-radius:10px;padding:9px 11px;font-size:10px;font-weight:850}
              .ops-btn:hover{background:var(--purpleSoft)}
              .ops-btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
              .ops-btn.danger{color:var(--red);border-color:#f0c9c4}
              .ops-btn.success{color:var(--green);border-color:#c8e8dd}
              .ops-btn:disabled{opacity:.48;cursor:not-allowed;background:#f7f8fa;color:#8b93a2;border-color:#e6e8ed}
              .ops-select{border:1px solid #d9dce5;background:#fff;border-radius:10px;padding:9px 10px;font-size:10px;min-width:220px;color:var(--ink)}
              .ops-message{font-size:10px;line-height:1.45;margin-top:10px;padding:9px 10px;border-radius:9px;display:none}
              .ops-message.show{display:block}.ops-message.ok{background:var(--greenSoft);color:var(--green)}.ops-message.error{background:var(--redSoft);color:var(--red)}.ops-message.info{background:var(--blueSoft);color:var(--blue)}
          '''
          if '.ops-panel{' not in s:
              s = s.replace('    .brand-logos{display:flex;', css + '\n    .brand-logos{display:flex;', 1)

          old_warning = '<div class="warning-banner">Operational write actions remain protected by the existing Apps Script safety lock. This portal is connected to live V2 records, reports and documents without weakening that control.</div>'
          new_warning = '<div class="warning-banner" id="opsSafetyBanner">Operational actions are protected by the V2 admin authentication and workflow gates. Actions are shown only for the applicant\'s current stage.</div>\n      <div id="opsPanel" class="ops-panel"></div>'
          if 'id="opsPanel"' not in s:
              if old_warning not in s:
                  raise SystemExit('Drawer warning marker not found')
              s = s.replace(old_warning, new_warning, 1)

          if "const ACTION_API = '/api/admin-action';" not in s:
              s = s.replace("    const API = '/api/admin-data';", "    const API = '/api/admin-data';\n    const ACTION_API = '/api/admin-action';", 1)

          old_open = "renderProgress(selected);renderQuickActions(selected);renderDetailTabs(selected);detailTab('overview',document.querySelector('.tabs button'));"
          new_open = "renderProgress(selected);renderQuickActions(selected);renderOperationalActions(selected);renderDetailTabs(selected);detailTab('overview',document.querySelector('.tabs button'));"
          if old_open in s:
              s = s.replace(old_open, new_open, 1)
          elif 'renderOperationalActions(selected);' not in s:
              raise SystemExit('openRecord marker not found')

          js = r'''
    function opsMsg(text,type='info'){const el=document.getElementById('opsMessage');if(!el)return;el.className='ops-message show '+type;el.textContent=text}
    function currentSacSession(r){return r.workflow?.['SAC Session ID']||r.sac?.['SAC Session ID']||r.sac?.['Session ID']||''}
    function renderOperationalActions(r){
      const el=document.getElementById('opsPanel');if(!el)return;
      const s=stage(r), sessions=(db.V2_SAC_SESSIONS||[]).filter(x=>!/FINAL|CLOSED/.test(String(x['Status']||'').toUpperCase()));
      let copy='Actions available for this stage.', actions='';
      if(s==='APPLICATION_RECEIVED'){
        copy='Start the formal document-review stage for this applicant.';
        actions='<button class="ops-btn primary" onclick="startDocumentReview()">Start Document Review</button>';
      }else if(s==='DOCUMENT_REVIEW'){
        copy='Document Review is active. Complete / Incomplete verification remains governed by the dedicated Document Review module.';
        actions='<button class="ops-btn" disabled>Complete Review — module route pending</button>';
      }else if(s==='QUALIFICATION_SCREENING'){
        copy='Qualification Screening is active. The rule-engine result must be recorded before SAC preparation.';
        actions='<button class="ops-btn" disabled>Run Screening — module route pending</button>';
      }else if(s==='READY_FOR_SAC'){
        copy='Screening is complete. Assign this applicant to an available SAC session.';
        const opts=sessions.map(x=>{const id=x['SAC Session ID']||x['Session ID']||'';const name=x['SAC Name']||id;return `<option value="${esc(id)}">${esc(name)}</option>`}).join('');
        actions=opts?`<select id="opsSacSession" class="ops-select"><option value="">Select SAC session</option>${opts}</select><button class="ops-btn primary" onclick="assignSacSession()">Assign to SAC</button>`:'<button class="ops-btn" disabled>No open SAC session</button>';
      }else if(s==='SAC_REVIEW'||s==='SAC'){
        copy='Record the authorised SAC outcome. Direct Entry proceeds to Offer eligibility; IA creates the assessment pathway.';
        actions='<button class="ops-btn success" onclick="recordSacDecision(\'DIRECT_ENTRY\')">Direct Entry</button><button class="ops-btn" onclick="recordSacDecision(\'INTERNAL_ASSESSMENT\')">Internal Assessment</button><button class="ops-btn danger" onclick="recordSacDecision(\'REJECTED\')">Rejected</button>';
      }else if(s==='INTERNAL_ASSESSMENT'){
        copy='Record the authorised IA panel result. Prerequisite can only be required after IA.';
        actions='<button class="ops-btn success" onclick="recordAssessmentResult(\'QUALIFIED\')">IA Qualified</button><button class="ops-btn" onclick="recordAssessmentResult(\'PREREQUISITE_REQUIRED\')">Prerequisite Required</button><button class="ops-btn danger" onclick="recordAssessmentResult(\'NOT_QUALIFIED\')">Not Qualified</button>';
      }else if(s==='PREREQUISITE'){
        copy='Record the final prerequisite result.';
        actions='<button class="ops-btn success" onclick="recordPrerequisiteResult(\'QUALIFIED\')">Prerequisite Qualified</button><button class="ops-btn danger" onclick="recordPrerequisiteResult(\'NOT_QUALIFIED\')">Not Qualified</button>';
      }else if(s==='ELIGIBLE_FOR_OFFER'){
        copy='All admission gates are complete. Offer generation remains governed by the protected Offer Letter V2 module.';
        actions='<button class="ops-btn" disabled>Generate Offer — module route pending</button>';
      }else if(s==='OFFER_ISSUED'||s==='ACCEPTANCE_PENDING'){
        copy='Offer has been issued. Monitor the Acceptance status and signed PDF.';
        actions='<button class="ops-btn" disabled>Awaiting student acceptance</button>';
      }else if(s==='ACCEPTED'){
        copy='Admission is confirmed. No further Admission V2 action is required in the current scope.';
        actions='<span class="badge green">Admission Complete</span>';
      }else if(s==='REJECTED'||s==='WITHDRAWN'){
        copy='This admission route is closed.';
        actions=`<span class="badge red">${esc(pretty(s))}</span>`;
      }else{
        copy='No operational action is configured for this stage.';
        actions='<button class="ops-btn" disabled>No action available</button>';
      }
      el.innerHTML=`<div class="ops-head"><div class="title">Operational Action Center</div><div class="state">${esc(pretty(s))}</div></div><div class="ops-copy">${copy}</div><div class="ops-actions">${actions}</div><div id="opsMessage" class="ops-message"></div>`;
    }
    async function runAdminAction(action,data,confirmText){
      if(confirmText&&!confirm(confirmText))return null;
      opsMsg('Processing…','info');
      try{
        const res=await fetch(ACTION_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,action,data,updatedBy:'Admin Portal V2'})});
        const out=await res.json().catch(()=>({ok:false,message:'Invalid response from action service.'}));
        if(!res.ok||!out.ok)throw new Error(out.message||'Unable to complete action.');
        const ref=selected?.ref||data?.referenceNo||'';
        opsMsg('Action completed successfully. Refreshing record…','ok');
        await loadData(true);
        if(ref){selected=records.find(x=>x.ref===ref)||selected;if(selected){renderProgress(selected);renderQuickActions(selected);renderOperationalActions(selected);renderDetailTabs(selected)}}
        return out.result||out;
      }catch(e){opsMsg(e.message||'Unable to complete action.','error');return null}
    }
    function startDocumentReview(){if(!selected)return;runAdminAction('v2UpdateStage',{referenceNo:selected.ref,stage:'DOCUMENT_REVIEW'},`Start Document Review for ${selected.app['Student Name']||selected.ref}?`)}
    function assignSacSession(){if(!selected)return;const el=document.getElementById('opsSacSession'),sessionId=el?.value||'';if(!sessionId)return opsMsg('Select a SAC session first.','error');runAdminAction('v2AssignSacCandidate',{referenceNo:selected.ref,sessionId},`Assign ${selected.app['Student Name']||selected.ref} to the selected SAC session?`)}
    function recordSacDecision(decision){if(!selected)return;const sessionId=currentSacSession(selected);if(!sessionId)return opsMsg('SAC Session ID is missing for this applicant.','error');const label=pretty(decision);runAdminAction('v2RecordSacDecision',{referenceNo:selected.ref,sessionId,decision},`Confirm final SAC decision: ${label}? This changes the admission route.`)}
    function recordAssessmentResult(panelResult){if(!selected)return;runAdminAction('v2UpdateAssessment',{referenceNo:selected.ref,assessmentType:'INTERNAL_ASSESSMENT',sequence:1,component:'OVERALL',status:'COMPLETED',panelResult},`Confirm IA panel result: ${pretty(panelResult)}?`)}
    function recordPrerequisiteResult(panelResult){if(!selected)return;runAdminAction('v2UpdateAssessment',{referenceNo:selected.ref,assessmentType:'PREREQUISITE',sequence:1,component:'OVERALL',status:'COMPLETED',panelResult},`Confirm Prerequisite result: ${pretty(panelResult)}?`)}
          '''
          if 'function renderOperationalActions' not in s:
              marker='    function renderProgress(r)'
              if marker not in s:
                  raise SystemExit('renderProgress marker not found')
              s=s.replace(marker, js+'\n'+marker, 1)

          p.write_text(s)

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'adiybukhori'
          git config user.email 'muhammadadiy93@gmail.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No admin UI changes required.'
          else
            git commit -m 'Add protected operational action center to Admin V2'
            git push origin main
          fi
