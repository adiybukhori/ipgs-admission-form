name: Gate Phase 2 Backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-phase2-backend.yml'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply backend sync safety gate
        run: python .github/scripts/gate_phase2_backend.py
      - name: Validate gate
        run: |
          grep -q 'PHASE2_BACKEND_SYNC_GATE_V1' admin.html
          grep -q 'PHASE2_BACKEND_READY = false' admin.html
      - name: Commit gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Gate Phase 2 actions until Apps Script sync passes"
          git push origin main
