name: Patch Admin V2 Operations UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-operations.yml'
      - '.github/scripts/patch_admin_ops.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch admin operations UI
        run: python3 .github/scripts/patch_admin_ops.py
      - name: Commit and push
        run: |
          git config user.name 'adiybukhori'
          git config user.email 'muhammadadiy93@gmail.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No admin UI changes required.'
          else
            git commit -m 'Add protected operational action center to Admin V2'
            git push origin main
          fi
