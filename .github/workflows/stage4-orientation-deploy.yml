name: Stage 4 Orientation Deploy
# end-session-v1
# milestone-reminders-v2
# edit-ended-session-v1
# feedback-form-v1
# official-report-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage4-orientation-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Admin Stage 4
        run: |
          node --check orientation-admin.js
          node --check api/admin-action.js
          node --check api/admin-data.js
          grep -F 'Create Orientation Session' admin.html
          grep -F 'v2AssignOrientationBatch' api/admin-action.js
          grep -F 'v2EditOrientationSession' api/admin-action.js
          grep -F 'openOrientationEdit' orientation-admin.js
          grep -F 'Add Student Record' orientation-admin.js
          grep -F 'openOrientationAttendance' orientation-admin.js
          grep -F 'showOrientationQr' orientation-admin.js
          grep -F 'sendOrientationRecording' orientation-admin.js
          grep -F 'sendOrientationInvitation' orientation-admin.js
          grep -F 'openOrientationManageStudents' orientation-admin.js
          grep -F 'openOrientationCreateModal' orientation-admin.js
          grep -F 'openOrientationCompletion' orientation-admin.js
          grep -F 'viewOrientationReport' orientation-admin.js
          grep -F 'downloadOrientationReport' orientation-admin.js
          grep -F 'v2GetOrientationReportFile' api/admin-action.js
          grep -F 'ipgs-admission-form.innovative.edu.my/orientation-attendance.html' orientation-admin.js
          grep -F 'v2RemoveOrientationStudent' orientation-admin.js
          grep -F 'v2MoveOrientationStudent' orientation-admin.js
          grep -F 'orientation-actions' admin.html
          test -f orientation-attendance.html
          grep -F 'fProgrammeStructure' orientation-attendance.html
          grep -F 'Would you recommend this orientation session to future students?' orientation-attendance.html
          test -f api/orientation-attendance.js

      - name: Checkout Apps Script branch
        run: |
          git fetch origin apps-script-v2-dev
          git checkout -B apps-script-v2-dev origin/apps-script-v2-dev

      - name: Validate Orientation backend
        run: |
          node --check apps-script-v2/OrientationV2.js
          node --check apps-script-v2/WorkflowV2.js
          grep -F 'v2OrientationReminderSweep' apps-script-v2/OrientationV2.js
          grep -F 'function v2EndOrientationSession_' apps-script-v2/OrientationV2.js
          grep -F 'function v2EditOrientationSession_' apps-script-v2/OrientationV2.js
          grep -F 'historicalOnly' apps-script-v2/OrientationV2.js
          grep -F 'function v2OpenOrientationAttendance_' apps-script-v2/OrientationV2.js
          grep -F 'function v2SubmitOrientationAttendance_' apps-script-v2/OrientationV2.js
          grep -F 'function v2SendOrientationRecording_' apps-script-v2/OrientationV2.js
          grep -F 'function v2SendOrientationInvitation_' apps-script-v2/OrientationV2.js
          grep -F 'function v2RemoveOrientationStudent_' apps-script-v2/OrientationV2.js
          grep -F 'function v2MoveOrientationStudent_' apps-script-v2/OrientationV2.js
          grep -F 'function v2CompleteOrientationAndGenerateReport_' apps-script-v2/OrientationV2.js
          grep -F 'function v2RegenerateOrientationReport_' apps-script-v2/OrientationV2.js
          grep -F 'function v2GetOrientationReportFile_' apps-script-v2/OrientationV2.js
          grep -F "V2_ORIENTATION_REPORT_TEMPLATE_ID = '1NiNXYRb0-6ighA016hk9vqdyv4lGyqtcY6DBdS8nSxg'" apps-script-v2/OrientationV2.js
          grep -F "V2_ORIENTATION_BUILD = 'ORIENTATION_V2_OFFICIAL_REPORT_20260920'" apps-script-v2/OrientationV2.js
          grep -F "'v2CompleteOrientationAndGenerateReport'" apps-script-v2/WorkflowV2.js
          grep -F "'v2GetOrientationReportFile'" apps-script-v2/WorkflowV2.js
          grep -F "V2_ORIENTATION_ATTENDANCE_BASE_URL = 'https://ipgs-admission-form.innovative.edu.my/orientation-attendance.html'" apps-script-v2/OrientationV2.js
          grep -F 'Feedback Average Score' apps-script-v2/OrientationV2.js
          grep -F 'IPGS_ORIENTATION_FEEDBACK_V2_20260920' apps-script-v2/OrientationV2.js
          grep -F "'v2RemoveOrientationStudent'" apps-script-v2/WorkflowV2.js
          grep -F "'v2MoveOrientationStudent'" apps-script-v2/WorkflowV2.js
          grep -F "'v2SendOrientationInvitation'" apps-script-v2/WorkflowV2.js
          grep -F 'v2GetOrientationAttendanceContext' apps-script-v2/WorkflowV2.js
          grep -F 'v2SubmitOrientationAttendance' apps-script-v2/Code.js
          grep -F 'v2EditOrientationSession' apps-script-v2/WorkflowV2.js
          grep -F 'Orientation session has ended' apps-script-v2/OrientationV2.js
          grep -F 'MILESTONE_V2_15MIN' apps-script-v2/OrientationV2.js
          grep -F '.everyMinutes(15)' apps-script-v2/OrientationV2.js
          grep -F "if (daysUntil === 3) return 'D3';" apps-script-v2/OrientationV2.js
          grep -F "if (daysUntil === 2) return 'D2';" apps-script-v2/OrientationV2.js
          grep -F "if (daysUntil === 1) return 'D1';" apps-script-v2/OrientationV2.js
          grep -F "return 'H1';" apps-script-v2/OrientationV2.js
          grep -F 'v2CreateOrientationSession' apps-script-v2/WorkflowV2.js

      - name: Verify clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo 'CLASPRC_JSON secret is not configured.' && exit 1)

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify locked V2 target
        run: node tools/verify-clasp-target.mjs

      - name: Push Apps Script source
        run: clasp push -f

      - name: Redeploy existing V2 web app
        env:
          V2_DEPLOYMENT_ID: AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB
        run: clasp create-deployment --deploymentId "$V2_DEPLOYMENT_ID" --description "Stage 4 official Orientation completion report"

      - name: Remove clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"