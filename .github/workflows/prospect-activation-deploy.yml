name: Prospect Registry Activation Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prospect-activation-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Admin Prospect Activation
        run: |
          node --check activation-admin.js
          node --check api/admin-action.js
          node --check api/admin-data.js
          grep -F 'Prospect & SKY Activation' admin.html
          grep -F 'v2RegistryUpsertProspect' api/admin-action.js
          grep -F 'v2ActivateStudentInSky' api/admin-action.js
          grep -F 'FEE_GROUP_MASTER' api/admin-data.js

      - name: Checkout Apps Script V2 branch
        run: |
          git fetch origin apps-script-v2-dev
          git checkout -B apps-script-v2-dev origin/apps-script-v2-dev

      - name: Validate Apps Script Prospect Activation
        run: |
          node --check apps-script-v2/ActivationV2.js
          node --check apps-script-v2/WorkflowV2.js
          node --check apps-script-v2/AgentProspectV2.js
          node --check apps-script-v2/NotificationEngineV2.js
          node --check apps-script-v2/OrientationV2.js
          grep -F 'function v2ActivateStudentInSky_' apps-script-v2/ActivationV2.js
          grep -F 'v2NotifyRegistryProspectReady_' apps-script-v2/AgentProspectV2.js
          grep -F 'Registry must confirm SKY activation first' apps-script-v2/OrientationV2.js

      - name: Verify clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo 'CLASPRC_JSON secret is not configured.' && exit 1)

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify locked V2 target
        run: node tools/verify-clasp-target.mjs

      - name: Push Apps Script source
        run: clasp push -f

      - name: Redeploy V2 web app
        env:
          V2_DEPLOYMENT_ID: AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB
        run: clasp create-deployment --deploymentId "$V2_DEPLOYMENT_ID" --description "Prospect Registry Activation gate"

      - name: Remove clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"
