name: Apply manual SAC phase 1 router

on:
  push:
    branches: [apps-script-v2-dev]
    paths:
      - '.github/scripts/apply_sac_manual_router.py'
      - '.github/workflows/apply-sac-manual-router.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded router patch
        run: python .github/scripts/apply_sac_manual_router.py
      - name: Validate Apps Script JavaScript
        run: |
          set -e
          for f in apps-script-v2/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script-v2/WorkflowV2.js
          git commit -m "Wire manual SAC phase 1 routes"
          git push origin apps-script-v2-dev
