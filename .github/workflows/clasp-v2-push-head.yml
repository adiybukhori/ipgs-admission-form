name: Clasp V2 Push HEAD

on:
  push:
    branches:
      - apps-script-v2-dev
    paths:
      - '.github/workflows/clasp-v2-push-head.yml'

permissions:
  contents: write

# Force-sync the full Admission V2 source tree to the locked Apps Script project.
# Deployment trigger: Orientation clean date-time formatting 2026-09-20.
# Deployment trigger: remove Fee Structure template dependency 2026-09-20.
# Deployment trigger: Registry Fee Group exception-only edit 2026-09-20.
# Deployment trigger: JSON-safe agent action bridge 2026-09-20.
# Deployment trigger: Action ID + token agent link fix 2026-09-20.
# Deployment trigger: Marketing-owned prospect flow confirmed 2026-09-20.
# Deployment trigger: four required admission documents + Adiy/Huzaifah new-application notification 2026-09-23.
# Deployment trigger: BOD SOP submission COL + welcome email + one-COL IA/PREQ rule 2026-09-23.
# Deployment trigger: synced cloud HEAD for controlled agentic UAT 2026-09-27.
# Deployment trigger: parallel Compliance document AI calls to stay under proxy timeout 2026-09-27.
# Deployment trigger: pre-generate the existing Acceptance Pack before Offer email and expose controlled pack preparation 2026-09-27.
jobs:
  push-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 source
        uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0

      - name: Patch Compliance document calls to parallel execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('apps-script-v2/ComplianceAgentV2.js')
          text = p.read_text(encoding='utf-8')
          if 'UrlFetchApp.fetchAll(requests)' in text:
              print('Compliance parallel patch already present.')
              raise SystemExit(0)
          replacement = r'''  const requests = uploaded.documents.map(function(doc){
            return {
              url:webhookUrl,
              method:'post',
              contentType:'application/json',
              headers:{'X-IUC-Agent-Secret':secret},
              payload:JSON.stringify({
                mode:'DOCUMENT',
                referenceNo:String(referenceNo || ''),
                applicantName:applicantName,
                applicantId:applicantId,
                programme:programme,
                field:doc.field,
                label:doc.label,
                fileName:doc.fileName,
                mimeType:doc.mimeType,
                base64:doc.base64
              }),
              muteHttpExceptions:true
            };
          });

          let responses = [];
          try {
            responses = UrlFetchApp.fetchAll(requests);
          } catch (batchError) {
            uploaded.sources.forEach(function(source){
              if (!source.error) source.error = 'N8N_AI_GATEWAY_BATCH: ' + String(batchError && batchError.message || batchError);
            });
          }

          uploaded.documents.forEach(function(doc, index){
            try {
              const httpResponse = responses[index];
              if (!httpResponse) throw new Error('DOCUMENT_RESPONSE_MISSING');
              const code = httpResponse.getResponseCode();
              const text = httpResponse.getContentText();
              if (code < 200 || code >= 300) throw new Error('HTTP_' + code + ': ' + text.slice(0,300));
              let response;
              try { response = JSON.parse(text); }
              catch (_) { throw new Error('INVALID_JSON: ' + text.slice(0,200)); }
              if (!response || response.ok !== true) throw new Error('INVALID_RESPONSE');
              const result = response.result || {};
              if (!result.document || typeof result.document !== 'object') throw new Error('DOCUMENT_RESULT_MISSING');
              findings.push(result.document);
              if (Array.isArray(result.flags)) result.flags.forEach(function(x){ flags.push(String(x)); });
              const c = Number(result.confidence != null ? result.confidence : result.document.confidence);
              if (isFinite(c)) confidenceValues.push(Math.max(0,Math.min(1,c)));
              if (response.runId) runIds.push(String(response.runId));
              if (response.model) models.push(String(response.model));
            } catch (error) {
              const source = uploaded.sources.filter(function(s){
                return s.field === doc.field && s.fileName === doc.fileName && !s.error;
              })[0];
              if (source) source.error = 'N8N_AI_GATEWAY: ' + String(error && error.message || error);
            }
          });'''
          pattern = r"  uploaded\.documents\.forEach\(function\(doc\)\{.*?\n  \}\);\n\n  let crossDocumentConsistency"
          text2, n = re.subn(pattern, replacement + '\n\n  let crossDocumentConsistency', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Compliance sequential block replacement count: {n}')
          p.write_text(text2, encoding='utf-8')
          PY

      - name: Patch existing Offer and Acceptance Pack flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('apps-script-v2/WorkflowV2.js')
          text = workflow.read_text(encoding='utf-8')
          dispatch = "  if (action === 'v2PrepareAcceptancePack') return v2AcceptancePackEnsureReviewDocs_((payload.data || {}).referenceNo, payload.updatedBy || 'Admin Portal V2');\n"
          anchor = "  if (action === 'v2IssueOffer') return v2IssueOffer_((payload.data || {}).referenceNo, payload.updatedBy || 'Admin Portal V2', payload.data || {});\n"
          if "action === 'v2PrepareAcceptancePack'" not in text:
              if anchor not in text:
                  raise SystemExit('v2IssueOffer dispatcher anchor not found')
              text = text.replace(anchor, anchor + dispatch, 1)
              workflow.write_text(text, encoding='utf-8')
          else:
              print('Acceptance Pack dispatcher already present.')

          offer = Path('apps-script-v2/OfferLetterV2.js')
          text = offer.read_text(encoding='utf-8')
          marker = "const acceptancePack = v2AcceptancePackEnsureReviewDocs_("
          if marker not in text:
              old = "  const generated = v2GenerateOfferLetter_(reference, actor || 'Offer Issuance');\n  let email = {sent:false,mode:'NOT_REQUESTED',status:'NOT_REQUESTED'};"
              new = "  const generated = v2GenerateOfferLetter_(reference, actor || 'Offer Issuance');\n  // Prepare the EXISTING approved Acceptance Pack before the student receives the link.\n  // This keeps acceptance-v2.html fast and avoids first-open spinner/timeouts.\n  const acceptancePack = v2AcceptancePackEnsureReviewDocs_(\n    reference,\n    actor || 'Offer Issuance'\n  );\n  let email = {sent:false,mode:'NOT_REQUESTED',status:'NOT_REQUESTED'};"
              if old not in text:
                  raise SystemExit('v2IssueOffer generation anchor not found')
              text = text.replace(old, new, 1)
              old_return = "    acceptanceSigningUrl:prepared.acceptanceSigningUrl,\n    emailSent:!!email.sent,"
              new_return = "    acceptanceSigningUrl:prepared.acceptanceSigningUrl,\n    acceptancePackStatus:String(acceptancePack && acceptancePack.status || ''),\n    acceptancePackDocumentCount:Array.isArray(acceptancePack && acceptancePack.documents) ? acceptancePack.documents.length : 0,\n    emailSent:!!email.sent,"
              if old_return not in text:
                  raise SystemExit('v2IssueOffer return anchor not found')
              text = text.replace(old_return, new_return, 1)
              offer.write_text(text, encoding='utf-8')
          else:
              print('Offer Acceptance Pack pre-generation already present.')
          PY

      - name: Commit patched V2 source
        run: |
          if git diff --quiet -- apps-script-v2/ComplianceAgentV2.js apps-script-v2/WorkflowV2.js apps-script-v2/OfferLetterV2.js; then
            echo 'No source commit required.'
          else
            git config user.name 'adiybukhori'
            git config user.email 'muhammadadiy93@gmail.com'
            git add apps-script-v2/ComplianceAgentV2.js apps-script-v2/WorkflowV2.js apps-script-v2/OfferLetterV2.js
            git commit -m 'Repair existing Offer Acceptance Pack flow'
            git push origin apps-script-v2-dev
          fi

      - name: Verify clasp credential is configured
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON secret is not configured."
            exit 1
          fi

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify locked V2 target
        run: node tools/verify-clasp-target.mjs

      - name: Syntax-check Apps Script JavaScript
        run: |
          set -e
          for f in apps-script-v2/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Show clasp target status
        run: clasp status

      - name: Force push complete V2 source to Apps Script HEAD
        run: clasp push --force

      - name: Confirm status after push
        run: clasp status

      - name: Redeploy existing V2 web app
        env:
          V2_DEPLOYMENT_ID: AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB
        run: clasp create-deployment --deploymentId "$V2_DEPLOYMENT_ID" --description "Admission V2 existing Acceptance Pack pre-generation repair"

      - name: Remove clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"
