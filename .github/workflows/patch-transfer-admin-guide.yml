name: Patch transfer visibility and guide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-transfer-admin-guide.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Show fresh transfer status in ACC and guide
        shell: python
        run: |
          from pathlib import Path

          admin = Path('admin.html')
          s = admin.read_text(encoding='utf-8')
          old = "[pair('ID / Passport',r.app['ID / Passport No']),pair('Country',raw.country),pair('Nationality',raw.nationality),pair('Gender',raw.gender),pair('Employment',raw.employmentStatus),pair('Sector',raw.employmentSector)]"
          new = "[pair('ID / Passport',r.app['ID / Passport No']),pair('Admission Entry Type',String(r.app['Transfer Applicant']||'NO').toUpperCase()==='YES'?'Transfer Student':'Fresh Student'),pair('Country',raw.country),pair('Nationality',raw.nationality),pair('Gender',raw.gender),pair('Employment',raw.employmentStatus),pair('Sector',raw.employmentSector)]"
          if old not in s:
              raise SystemExit('ACC overview anchor not found; refusing to patch.')
          s = s.replace(old, new, 1)
          admin.write_text(s, encoding='utf-8')

          guide = Path('system-guide-training-latest.js')
          g = guide.read_text(encoding='utf-8')
          g = g.replace("const VERSION='2026-10-02';", "const VERSION='2026-10-03';", 1)
          g = g.replace("const LABEL='LATEST ARRANGEMENT · 2 OCT 2026';", "const LABEL='LATEST ARRANGEMENT · 3 OCT 2026';", 1)

          item8 = '        <div class="guide-latest-item"><em>08</em><div><b>IA / PREREQ Uses Email — No Second COL</b><span>IA and prerequisite communication uses the relevant email and attachments only. After the approved route is completed, proceed to the Official Offer Letter / LOA without issuing another COL and without routine re-SAC.</span></div></div>'
          item9 = item8 + '\n        <div class="guide-latest-item"><em>09</em><div><b>Fresh vs Transfer Student Identification</b><span>Every applicant must select Fresh Student or Transfer Student during Programme Selection. Transfer status is saved into the application record, shown in the Admission Form PDF and visible to Registry in the ACC applicant overview. Race options also include Chinese.</span></div></div>'
          if item8 not in g:
              raise SystemExit('Guide item 08 anchor not found; refusing to patch.')
          g = g.replace(item8, item9, 1)

          old_note = 'four core initial documents are IC / Passport, Transcript, Certificate and CV / Resume; document exceptions are non-blocking when authorised;'
          new_note = 'every applicant identifies as Fresh Student or Transfer Student; four core initial documents are IC / Passport, Transcript, Certificate and CV / Resume; document exceptions are non-blocking when authorised;'
          if old_note not in g:
              raise SystemExit('Guide flow note anchor not found; refusing to patch.')
          g = g.replace(old_note, new_note, 1)

          old_slide = 'every valid submission should show evidence of both outward communication (COL + Admission Form PDF to student) and inward communication (New Application notification to Admission team).'
          new_slide = 'every valid submission should record Fresh Student / Transfer Student status and show evidence of both outward communication (COL + Admission Form PDF to student) and inward communication (New Application notification to Admission team).'
          if old_slide not in g:
              raise SystemExit('Guide application slide anchor not found; refusing to patch.')
          g = g.replace(old_slide, new_slide, 1)
          guide.write_text(g, encoding='utf-8')
      - name: Sanity check
        run: |
          grep -q "Admission Entry Type.*Transfer Student.*Fresh Student" admin.html
          grep -q "Fresh vs Transfer Student Identification" system-guide-training-latest.js
          grep -q "LATEST ARRANGEMENT · 3 OCT 2026" system-guide-training-latest.js
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-transfer-admin-guide.yml
          git add admin.html system-guide-training-latest.js
          git diff --cached --quiet && exit 0
          git commit -m "Show transfer status in ACC and update training guide"
          git push origin main
