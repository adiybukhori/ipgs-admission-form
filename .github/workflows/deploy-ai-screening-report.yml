name: Deploy Official AI Screening Report
# source-sync: apps-script-v2-dev@feccd4f76eba6fac6473d3108a3f83a95be60c03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ai-screening-report.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout Apps Script V2 source
        run: |
          git fetch origin apps-script-v2-dev
          git checkout -B apps-script-v2-dev origin/apps-script-v2-dev

      - name: Validate AI screening backend
        run: |
          node --check apps-script-v2/AIScreeningV2.js
          node --check apps-script-v2/AgenticBridgeV2.js
          node --check apps-script-v2/HumanTaskV2.js
          node --check apps-script-v2/ComplianceAgentV2.js
          node --check apps-script-v2/DocumentReplacementV2.js
          node --check apps-script-v2/SacIaAgentV2.js
          node --check apps-script-v2/OrientationAgentV2.js
          node --check apps-script-v2/SystemsOperatorAgentV2.js
          node --check apps-script-v2/AcademicHandoverAgentV2.js
          node --check apps-script-v2/ManagementIntelligenceAgentV2.js
          node --check apps-script-v2/HandoverV2.js
          node --check apps-script-v2/AgentProspectV2.js
          node --check apps-script-v2/AcceptancePackV2.js
          node --check apps-script-v2/Code.js
          node --check apps-script-v2/AiScreeningReportV2.js
          node --check apps-script-v2/SacPackV2.js
          node --check apps-script-v2/WorkflowV2.js
          grep -F "AI_SCREENING_REPORT_V2" apps-script-v2/AiScreeningReportV2.js
          grep -F "v2GenerateAiScreeningReport_" apps-script-v2/AiScreeningReportV2.js
          grep -F "Official AI Admission Screening Report" apps-script-v2/SacPackV2.js
          grep -F "v2GenerateAiScreeningReport" apps-script-v2/WorkflowV2.js
          grep -F "v2AgentActionGateway_" apps-script-v2/AgenticBridgeV2.js
          grep -F "DOCUMENT_REVIEW_COMPLETED" apps-script-v2/DocumentReviewV2.js
          grep -F "v2CreateHumanTask_" apps-script-v2/HumanTaskV2.js
          grep -F "v2ResolveHumanTask_" apps-script-v2/HumanTaskV2.js
          grep -F "v2RunComplianceDocumentQuality_" apps-script-v2/ComplianceAgentV2.js
          grep -F "v2SendDocumentReplacementRequest_" apps-script-v2/DocumentReplacementV2.js
          grep -F "v2SendMissingDocumentRequest_" apps-script-v2/DocumentReplacementV2.js
          grep -F "MISSING_REQUIRED_DOCUMENT" apps-script-v2/DocumentReplacementV2.js
          grep -F "RUN_DOCUMENT_COMPLETENESS" apps-script-v2/AgenticBridgeV2.js
          grep -F "SEND_MISSING_DOCUMENT_REQUEST" apps-script-v2/AgenticBridgeV2.js
          grep -F "v2SubmitDocumentReplacementUpload" apps-script-v2/DocumentReplacementV2.js
          grep -F "v2PrepareSacCoordination_" apps-script-v2/SacIaAgentV2.js
          grep -F "v2PrepareIaCoordination_" apps-script-v2/SacIaAgentV2.js
          grep -F "v2PreparePrerequisiteCoordination_" apps-script-v2/SacIaAgentV2.js
          grep -F "v2PrepareOrientationForAccepted_" apps-script-v2/OrientationAgentV2.js
          grep -F "v2RunOrientationSessionSupervisor_" apps-script-v2/OrientationAgentV2.js
          grep -F "RUN_ORIENTATION_SUPERVISOR" apps-script-v2/AgenticBridgeV2.js
          grep -F "ORIENTATION_ATTENDANCE_REVIEW_REQUIRED" apps-script-v2/HumanTaskV2.js
          grep -F "ORIENTATION_RECORDING_URL_REQUIRED" apps-script-v2/HumanTaskV2.js
          grep -F "v2PrepareSkyActivation_" apps-script-v2/SystemsOperatorAgentV2.js
          grep -F "SKY_PROSPECT_VERIFIED" apps-script-v2/SystemsOperatorAgentV2.js
          grep -F "SKY_ACTIVATION_READY" apps-script-v2/AcceptancePackV2.js
          grep -F "v2PrepareAcademicHandover_" apps-script-v2/AcademicHandoverAgentV2.js
          grep -F "v2PrepareStudentAccessDelivery_" apps-script-v2/AcademicHandoverAgentV2.js
          grep -F "v2RunManagementIntelligence_" apps-script-v2/ManagementIntelligenceAgentV2.js
          grep -F "RUN_MANAGEMENT_INTELLIGENCE" apps-script-v2/AgenticBridgeV2.js
          grep -F "ISSUE_OFFER" apps-script-v2/AgenticBridgeV2.js
          grep -F "PROVISIONING_READY_TO_NOTIFY" apps-script-v2/HandoverV2.js
          grep -F "ACADEMIC_HANDOVER_COMPLETE" apps-script-v2/HandoverV2.js
          grep -F "HANDOVER_CONFIGURATION_REQUIRED" apps-script-v2/HumanTaskV2.js
          grep -F "STUDENT_ACCESS_CREDENTIALS_REQUIRED" apps-script-v2/HumanTaskV2.js
          grep -F "PROSPECT_COMPLETED" apps-script-v2/AgentProspectV2.js
          grep -F "SKY Prospect ID is required" apps-script-v2/AgentProspectV2.js
          grep -F "SKY_ACTIVATION_REQUIRED" apps-script-v2/HumanTaskV2.js
          grep -F "ACCEPTANCE_COMPLETED" apps-script-v2/AcceptancePackV2.js
          grep -F "PREPARE_ORIENTATION_FOR_ACCEPTED" apps-script-v2/AgenticBridgeV2.js
          grep -F "ORIENTATION_SESSION_REQUIRED" apps-script-v2/HumanTaskV2.js
          grep -F "SAC_DECISION_REQUIRED" apps-script-v2/HumanTaskV2.js
          grep -F "IA_OUTCOME_REQUIRED" apps-script-v2/HumanTaskV2.js
          grep -F "PREREQUISITE_OUTCOME_REQUIRED" apps-script-v2/HumanTaskV2.js
          grep -F "document-replacement-v2" apps-script-v2/Code.js
          grep -F "RUN_COMPLIANCE_DOCUMENT_QUALITY" apps-script-v2/AgenticBridgeV2.js
          grep -F "APPLICATION_SUBMITTED" apps-script-v2/AdmissionV2.js
          grep -F "DOCUMENT_COMPLETENESS_CONFIRMED" apps-script-v2/DocumentReviewV2.js
          grep -F "HANDED_TO_N8N_COMPLIANCE" apps-script-v2/ManualDocumentReviewV2.js

      - name: Verify clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo 'CLASPRC_JSON secret is not configured.' && exit 1)

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify locked V2 target
        run: node tools/verify-clasp-target.mjs

      - name: Push Apps Script source
        run: clasp push -f

      - name: Redeploy existing V2 web app
        env:
          V2_DEPLOYMENT_ID: AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB
        run: clasp create-deployment --deploymentId "$V2_DEPLOYMENT_ID" --description "Official AI screening report V2"

      - name: Remove clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"
