name: Deploy and Test Phase 2

on:
  push:
    branches:
      - apps-script-v2-dev
    paths:
      - '.github/workflows/deploy-test-phase2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 source
        uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0

      - name: Verify clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo 'CLASPRC_JSON secret is not configured.'
            exit 1
          fi

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify locked V2 target
        run: node tools/verify-clasp-target.mjs

      - name: Syntax check V2 source
        run: |
          set -e
          for f in apps-script-v2/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Push Phase 2 source to Apps Script
        run: clasp push

      - name: Show current deployments
        run: clasp list-deployments

      - name: Redeploy existing V2 web app
        env:
          V2_DEPLOYMENT_ID: AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB
        run: clasp create-deployment --deploymentId "$V2_DEPLOYMENT_ID" --description "Admission V2 Phase 2 screening offer acceptance"

      - name: Run controlled Phase 2 test suite
        run: |
          set -e
          clasp run-function v2Phase2ControlledTestSuite --json | tee phase2-test-output.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('phase2-test-output.json').read_text())
          response=data.get('response') or {}
          if not response.get('ok'):
              raise SystemExit('Phase 2 controlled test suite returned ok=false: '+json.dumps(response))
          print(json.dumps(response, indent=2))
          PY

      - name: Remove clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"
