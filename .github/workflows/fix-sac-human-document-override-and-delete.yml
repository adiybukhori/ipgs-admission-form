name: Repair SAC Stranded Participant Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sac-human-document-override-and-delete.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch SAC participant recovery logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          old="const eligible=records.filter(r=>r.source==='V2'&&stage(r)==='READY_FOR_SAC').filter(r=>!candidates.some(c=>String(c['Reference No']||'')===r.ref));"
          new="""const allSacCandidates=(db.V2_SAC_CANDIDATES||[]);\n      const eligible=records.filter(r=>{\n        if(r.source!=='V2')return false;\n        const st=stage(r);\n        if(st!=='READY_FOR_SAC'&&st!=='SAC_REVIEW')return false;\n        const assignedAnywhere=allSacCandidates.some(c=>String(c['Reference No']||'')===String(r.ref));\n        return !assignedAnywhere;\n      });"""
          if old not in s and "st!=='READY_FOR_SAC'&&st!=='SAC_REVIEW'" not in s:
              raise SystemExit('eligible SAC anchor not found')
          s=s.replace(old,new)
          s=s.replace('No candidates assigned yet. Complete Qualification Screening first so the applicant reaches Ready for SAC, then add the applicant here.','No candidates assigned yet. Applicants that are Ready for SAC — including stranded SAC Review cases not yet linked to an actual SAC participant record — can be added here.')
          s=s.replace('<option value="">Select Ready for SAC applicant</option>${eligibleOptions}','<option value="">Select applicant for SAC</option>${eligibleOptions}')
          p.write_text(s)
          PY

      - name: Validate admin
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('admin.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          for(const block of blocks)new Function(block);
          if(!html.includes("st!=='READY_FOR_SAC'&&st!=='SAC_REVIEW'")) throw new Error('recovery filter missing');
          if(!html.includes('Select applicant for SAC')) throw new Error('selector label missing');
          console.log('SAC_RECOVERY_OK');
          NODE

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet || git commit -m "Recover stranded SAC_REVIEW applicants into SAC participant selector"
          git push origin main
