name: Apply SAC Pack Open Actions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_sac_pack_open_actions.py'
      - '.github/workflows/apply-sac-pack-open-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch_sac_pack_open_actions.py

      - name: Validate inline JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('admin.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          for(const b of blocks)new Function(b);
          if(!html.includes('Open SAC Pack')) throw new Error('Open SAC Pack action missing');
          console.log('SAC_PACK_OPEN_ACTIONS_OK');
          NODE

      - name: Commit admin change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'Show saved SAC pack actions'
          git push origin main
