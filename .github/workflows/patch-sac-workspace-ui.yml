name: Patch SAC Workspace UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sac-workspace-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch ACC SAC workspace
        run: python3 tools/patch-sac-workspace.py

      - name: Validate SAC workspace patch
        run: |
          grep -q 'id="sacSessionModal"' admin.html
          grep -q 'function openSacSessionDetail' admin.html
          grep -q 'v2UpdateSacSessionManual' admin.html
          grep -q "'v2UpdateSacSessionManual'" api/admin-action.js
          grep -q 'sendInvitation:false' admin.html
          grep -q 'Generate & Print SAC Pack' admin.html
          node --check api/admin-action.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('admin.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          if not blocks:
              raise SystemExit('No inline script found')
          Path('/tmp/admin-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/admin-inline.js

      - name: Commit SAC workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html api/admin-action.js
          if git diff --cached --quiet; then
            echo "No ACC changes required."
          else
            git commit -m "Build SAC session workspace with panel participants invitations and print pack"
            git push origin main
          fi
