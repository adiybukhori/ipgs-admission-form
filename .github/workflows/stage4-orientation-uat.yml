name: Stage 4 Orientation UAT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage4-orientation-uat.yml'

permissions:
  contents: write

jobs:
  uat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apps Script V2 branch
        uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0

      - name: Validate Stage 4 UAT runner
        run: |
          node --check apps-script-v2/OrientationV2.js
          grep -F 'function v2RunStage4Uat()' apps-script-v2/OrientationV2.js

      - name: Verify clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo 'CLASPRC_JSON secret is not configured.' && exit 1)

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify locked V2 target and push latest source
        run: |
          node tools/verify-clasp-target.mjs
          clasp push -f

      - name: Verify Apps Script execution target
        id: ping
        shell: bash
        run: |
          set +e
          clasp run v2ExecutionPing >/tmp/stage4-ping-raw.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] && grep -F '1O-Y-q7_q78xKM1p5e2C3EWyQfYr5rXvhO0oWbVaw5Mw' /tmp/stage4-ping-raw.txt >/dev/null; then
            echo "target=V2_DEV" >> "$GITHUB_OUTPUT"
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "target=UNVERIFIED" >> "$GITHUB_OUTPUT"
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Save sanitized ping diagnostic
        if: steps.ping.outputs.status != 'PASS'
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p uat
          {
            echo "Stage 4 Apps Script execution ping"
            echo "Status: FAIL"
            echo "Executed: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Exit code: ${{ steps.ping.outputs.exit_code }}"
            echo
            echo "Sanitized command output:"
            sed -E \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[EMAIL_REDACTED]/g' \
              -e 's/(access_token|refresh_token|id_token|client_secret)[^[:space:]]*/[TOKEN_REDACTED]/Ig' \
              /tmp/stage4-ping-raw.txt | head -40
          } > uat/stage4-orientation-ping-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uat/stage4-orientation-ping-diagnostic.txt
          git commit -m "Record Stage 4 execution ping diagnostic" || true
          git push origin main
          exit 1

      - name: Execute controlled Stage 4 UAT
        if: steps.ping.outputs.status == 'PASS'
        id: run_uat
        shell: bash
        run: |
          set +e
          clasp run v2RunStage4Uat >/tmp/stage4-uat-raw.txt 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ] && grep -F '"uat":"PASS"' /tmp/stage4-uat-raw.txt >/dev/null; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Record sanitized UAT result
        shell: bash
        run: |
          status="${{ steps.run_uat.outputs.status }}"
          code="${{ steps.run_uat.outputs.exit_code }}"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p uat
          {
            echo "Stage 4 Orientation UAT"
            echo "Status: $status"
            echo "Executed: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Runner: v2RunStage4Uat"
            echo "Execution target: ${{ steps.ping.outputs.target }}"
            echo "Result marker verified: $([ "$status" = "PASS" ] && echo YES || echo NO)"
            echo "Exit code: $code"
          } > uat/stage4-orientation-latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uat/stage4-orientation-latest.txt
          git commit -m "Record Stage 4 orientation UAT result" || true
          git push origin main

      - name: Fail workflow when UAT fails
        if: steps.run_uat.outputs.status != 'PASS'
        run: |
          echo "Stage 4 UAT failed. Raw clasp output follows:"
          cat /tmp/stage4-uat-raw.txt
          exit 1

      - name: Remove clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"
