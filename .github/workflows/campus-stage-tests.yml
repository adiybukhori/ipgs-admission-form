name: Campus stage regression tests
on:
  pull_request:
    paths:
      - 'campus-v9/**'
      - 'tests/campus-*.cjs'
      - '.github/workflows/campus-stage-tests.yml'
  push:
    branches:
      - 'main'
      - 'feature/living-campus-ambient-20261019'
      - 'fix/living-campus-visible-walk-20261019'
    paths:
      - 'campus-v9/**'
      - 'tests/campus-*.cjs'
      - '.github/workflows/campus-stage-tests.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/campus-live-stages.cjs tests/campus-living-ambient.cjs tests/campus-real-navigation.cjs
