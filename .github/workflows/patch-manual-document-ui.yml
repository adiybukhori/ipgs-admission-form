name: Patch Manual Document Review UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-manual-document-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply UI patch
        run: python .github/scripts/patch_manual_document_ui.py
      - name: Validate
        run: |
          grep -q 'MANUAL_DOCUMENT_REVIEW_UI_V1' admin.html
          grep -q 'Submit Screening Decision' admin.html
          grep -q 'Manual Document Review' admin.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Add manual document review and screening submit UI"
          git push origin main
