name: Patch Phase 2 Admin UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-phase2-admin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Phase 2 Admin UI patch
        run: python .github/scripts/patch_phase2_admin.py
      - name: Validate Admin UI
        run: |
          grep -q 'PHASE2_SCREENING_OFFER_UI_V1' admin.html
          grep -q 'function retryAutoAiScreening' admin.html
          grep -q 'function completeManualScreening' admin.html
          grep -q 'function issueOffer' admin.html
          grep -q 'Generate & Send Offer' admin.html
      - name: Commit Admin UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Add manual screening fallback and offer acceptance actions"
          git push origin main
