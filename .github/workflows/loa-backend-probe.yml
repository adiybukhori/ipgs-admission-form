name: LOA Backend Read-only Probe
on:
  push:
    branches: [apps-script-v2-dev]
    paths: ['.github/workflows/loa-backend-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
      - name: Install existing deployment client
        run: npm install -g @google/clasp@3.4.1
      - name: Restore authorised Apps Script connection
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Run read-only execution ping
        run: clasp run-function v2ExecutionPing
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.clasprc.json"
