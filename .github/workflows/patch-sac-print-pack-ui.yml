name: Patch SAC Print Pack UI

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_sac_print_pack_ui.py'
      - '.github/workflows/patch-sac-print-pack-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply SAC print pack UI patch
        run: python .github/scripts/patch_sac_print_pack_ui.py
      - name: Validate admin inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          text=Path('admin.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          p=Path('/tmp/admin-inline.js')
          p.write_text('\n'.join(scripts), encoding='utf-8')
          subprocess.run(['node','--check',str(p)], check=True)
          PY
      - name: Validate SAC pack API
        run: node --check api/sac-pack.js
      - name: Verify UI markers
        run: |
          grep -q 'Generate & Print SAC Pack' admin.html
          grep -q 'sacPackModal' admin.html
          grep -q 'Proceed with available documents' admin.html
          grep -q 'Skip this candidate' admin.html
          grep -q 'SAC Pack · backend sync pending' admin.html
      - name: Commit UI update
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Add SAC merged print pack workflow to Admin"
          git push origin HEAD:main
