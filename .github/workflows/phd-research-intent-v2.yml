name: PhD Research Intent UX Fix

on:
  push:
    branches: [apps-script-v2-dev]
    paths:
      - 'apps-script-v2/ResearchIntentV2.js'
      - 'apps-script-v2/research-intent-v2.html'
      - 'tools/phd-research-intent-v2.py'
      - '.github/workflows/phd-research-intent-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apps Script V2 branch
        uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0

      - name: Apply PhD Research Intent patch
        run: python tools/phd-research-intent-v2.py

      - name: Validate source
        run: |
          node --check apps-script-v2/ResearchIntentV2.js
          node --check apps-script-v2/AdmissionV2.js
          node --check apps-script-v2/NotificationEngineV2.js
          node --check apps-script-v2/Code.js
          grep -F "v2PrepareResearchIntentRequirement_" apps-script-v2/AdmissionV2.js
          grep -F "research-intent-v2" apps-script-v2/Code.js
          grep -F "Upload Research Intent" apps-script-v2/NotificationEngineV2.js
          grep -F "v2SubmitResearchIntentUpload" apps-script-v2/research-intent-v2.html

      - name: Commit patched source
        run: |
          if git diff --quiet -- apps-script-v2/AdmissionV2.js apps-script-v2/NotificationEngineV2.js apps-script-v2/Code.js; then
            echo 'Source already patched.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps-script-v2/AdmissionV2.js apps-script-v2/NotificationEngineV2.js apps-script-v2/Code.js
            git commit -m 'Enable deferred PhD Research Intent upload'
            git push origin apps-script-v2-dev
          fi

      - name: Verify clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo 'CLASPRC_JSON secret is not configured.'
            exit 1
          fi

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify locked V2 target
        run: node tools/verify-clasp-target.mjs

      - name: Force push Apps Script source
        run: clasp push -f

      - name: Redeploy existing V2 web app
        env:
          V2_DEPLOYMENT_ID: AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB
        run: clasp create-deployment --deploymentId "$V2_DEPLOYMENT_ID" --description "PhD Research Intent optional initial submission with secure deferred upload"

      - name: Remove clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"
