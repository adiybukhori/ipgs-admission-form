name: Deploy Auto PG-ADM on Submission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-auto-pgadm.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apps Script branch
        uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0

      - name: Validate admission and PG-ADM source
        run: |
          node --check apps-script-v2/AdmissionV2.js
          node --check apps-script-v2/PgEligibilityV2.js
          grep -F "v2GeneratePgAdm01OnSubmission_" apps-script-v2/AdmissionV2.js
          grep -F "attempt <= 3" apps-script-v2/AdmissionV2.js
          grep -F "CONTROLLED_REFERENCE_LAYOUT" apps-script-v2/PgEligibilityV2.js
          grep -F "FORM PG-ADM-01. Eligibility and Route Determination Checklist" apps-script-v2/PgEligibilityV2.js

      - name: Verify clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo 'CLASPRC_JSON secret is not configured.' && exit 1)

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify locked V2 target
        run: node tools/verify-clasp-target.mjs

      - name: Push Apps Script source
        run: clasp push -f

      - name: Redeploy existing V2 web app
        env:
          V2_DEPLOYMENT_ID: AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB
        run: clasp create-deployment --deploymentId "$V2_DEPLOYMENT_ID" --description "Approved one-page PG-ADM-01 controlled layout"

      - name: Remove clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"