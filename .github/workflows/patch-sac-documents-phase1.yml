name: Patch SAC Documents Phase 1

on:
  push:
    branches: [apps-script-v2-dev]
    paths:
      - '.github/scripts/patch_sac_documents_phase1.py'
      - '.github/workflows/patch-sac-documents-phase1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded SAC document policy patch
        run: python .github/scripts/patch_sac_documents_phase1.py
      - name: Validate Apps Script JavaScript
        run: |
          set -e
          for f in apps-script-v2/*.js; do
            node --check "$f"
          done
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script-v2/SacDocumentsV2.js
          git commit -m "Align SAC minutes with manual Phase 1 policy"
          git push origin apps-script-v2-dev
