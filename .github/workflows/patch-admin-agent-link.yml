name: Patch Campus View Integration Branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-agent-link.yml'

permissions:
  contents: write

jobs:
  patch-campus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/campus-live-ai-dashboard
          fetch-depth: 0
      - name: Patch AI Operations Center on integration branch
        shell: python
        run: |
          from pathlib import Path
          p=Path('ai-operations-center.html')
          s=p.read_text(encoding='utf-8')
          marker='/* CAMPUS_LIVE_VIEW_V1 */'
          if marker not in s:
              css='''/* CAMPUS_LIVE_VIEW_V1 */
          .campus-live-shell{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0a1025;min-height:680px;position:relative}
          .campus-live-frame{display:block;width:100%;height:760px;border:0;background:#ece6d9}
          .campus-live-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--line);font-size:10px;color:#8f9ac3;background:rgba(7,9,20,.9)}
          .campus-live-note b{color:#bffbea}
          @media(max-width:900px){.campus-live-frame{height:650px}.campus-live-shell{min-height:590px}}
          @media(max-width:620px){.campus-live-frame{height:590px}.campus-live-shell{min-height:530px}}
          '''
              if '</style>' not in s: raise SystemExit('Style closing tag not found')
              s=s.replace('</style>',css+'\n  </style>',1)
          nav_anchor='<button data-view="journey" type="button" onclick="switchOpsView(\'journey\')">Student Journey</button>'
          if 'data-view="campus" type="button"' not in s:
              if nav_anchor not in s: raise SystemExit('Journey nav anchor not found')
              s=s.replace(nav_anchor,'<button data-view="campus" type="button" onclick="switchOpsView(\'campus\')">Campus View</button>\n    '+nav_anchor,1)
          section_anchor='  <section class="ops-view" data-view="journey" id="opsJourneyView">'
          campus='''  <section class="ops-view" data-view="campus" id="opsCampusView">
            <div class="tab-shell">
              <div class="tab-shell-head">
                <div><div class="eyebrow">LIVE ADMISSION V2 · READ-ONLY VISUAL OPERATIONS</div><h2>Campus View</h2><p>Students are positioned by their current Admission V2 stage and move to the next operational area when the authoritative workflow state changes.</p></div>
                <span class="tag green">LIVE · 30 SEC REFRESH</span>
              </div>
              <div class="tab-shell-body">
                <div class="campus-live-shell">
                  <iframe id="campusLiveFrame" class="campus-live-frame" src="/campus-rpg-v9.html?embedded=1" title="IPGS live admissions campus simulation" loading="lazy"></iframe>
                  <div class="campus-live-note"><b>Admission V2 is authoritative.</b><span>This view only reads workflow data; it does not write, approve, route, email or change student records.</span></div>
                </div>
              </div>
            </div>
          </section>

'''
          if 'id="opsCampusView"' not in s:
              if section_anchor not in s: raise SystemExit('Journey section anchor not found')
              s=s.replace(section_anchor,campus+section_anchor,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate Campus View
        run: |
          grep -q 'CAMPUS_LIVE_VIEW_V1' ai-operations-center.html
          grep -q 'data-view="campus"' ai-operations-center.html
          grep -q 'id="opsCampusView"' ai-operations-center.html
          grep -q '/campus-rpg-v9.html?embedded=1' ai-operations-center.html
      - name: Commit to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-operations-center.html
          git diff --cached --quiet && exit 0
          git commit -m "Add live Campus View to AI Operations Center"
          git push origin HEAD:chatgpt/campus-live-ai-dashboard
