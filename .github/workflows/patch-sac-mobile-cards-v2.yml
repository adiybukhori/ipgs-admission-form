name: Patch SAC mobile cards v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sac-mobile-cards-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch mobile SAC layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = "    .guide-badge.blue{background:var(--blueSoft);color:var(--blue)}\n\n    @media(max-width:1100px)"
          css_insert = """    .guide-badge.blue{background:var(--blueSoft);color:var(--blue)}

    .sac-mobile-list{display:none}
    .sac-mobile-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px;box-shadow:0 4px 16px rgba(29,37,59,.05)}
    .sac-mobile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
    .sac-mobile-title{font-size:14px;font-weight:900;line-height:1.3;color:var(--ink)}
    .sac-mobile-id{font-size:10px;color:var(--muted);margin-top:3px;word-break:break-all}
    .sac-mobile-meta{font-size:11px;color:var(--muted);margin-bottom:12px}
    .sac-mobile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .sac-mobile-field{border:1px solid #eef0f4;border-radius:11px;padding:9px 10px;background:#fbfbfd}
    .sac-mobile-field .label{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:#8a93a3;font-weight:800;margin-bottom:4px}
    .sac-mobile-field .value{font-size:11px;font-weight:750;color:var(--ink);line-height:1.35}
    .sac-mobile-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .sac-mobile-actions .primary,.sac-mobile-actions .ghost{width:100%;text-align:center;justify-content:center;display:inline-flex;align-items:center;min-height:44px;text-decoration:none}

    @media(max-width:1100px)"""
          if css_anchor not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(css_anchor, css_insert, 1)

          mobile_old = "    @media(max-width:700px){.app{display:block}.sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;height:64px;z-index:60;display:block;padding:7px;background:#21164f}.side-brand,.side-footer{display:none}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.nav button{padding:8px 4px;font-size:10px}.main{padding-bottom:66px}.topbar{padding:0 14px}.content{padding:18px 14px 30px}.hero{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:1fr 1fr}.kpi{padding:14px}.kpi .value{font-size:25px}.detail-grid,.guide-grid,.guide-intro{grid-template-columns:1fr}.detail-card.full{grid-column:auto}.progress{grid-template-columns:repeat(4,1fr)}}"
          mobile_new = "    @media(max-width:700px){.app{display:block}.sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;height:64px;z-index:60;display:block;padding:7px;background:#21164f}.side-brand,.side-footer{display:none}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.nav button{padding:8px 4px;font-size:10px}.main{padding-bottom:76px}.topbar{padding:0 14px}.content{padding:18px 14px 30px}.hero{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:1fr 1fr}.kpi{padding:14px}.kpi .value{font-size:25px}.detail-grid,.guide-grid,.guide-intro{grid-template-columns:1fr}.detail-card.full{grid-column:auto}.progress{grid-template-columns:repeat(4,1fr)}#sac .sac-desktop-table{display:none}.sac-mobile-list{display:grid;gap:12px;padding:14px}.sac-mobile-grid{grid-template-columns:1fr 1fr}#sac .panel-head{align-items:flex-start}#sac .panel-head span{line-height:1.35}.sac-mobile-actions .badge{justify-content:center;min-height:36px;width:100%}}"
          if mobile_old not in s:
              raise SystemExit('Mobile media query target not found')
          s = s.replace(mobile_old, mobile_new, 1)

          panel_old = '<div class="panel"><div class="panel-head"><h3>SAC sessions</h3><span>Assign candidates → physical meeting → admin result → minutes & endorsement</span></div><div class="table-wrap"><table><thead><tr><th>Session</th><th>Date</th><th>Mode</th><th>Status</th><th>Chairperson</th><th>Candidates</th><th>Invitation</th><th>Documents</th><th>Action</th></tr></thead><tbody id="sacBody"></tbody></table></div></div>'
          panel_new = '<div class="panel"><div class="panel-head"><h3>SAC sessions</h3><span>Assign candidates → physical meeting → admin result → minutes & endorsement</span></div><div class="table-wrap sac-desktop-table"><table><thead><tr><th>Session</th><th>Date</th><th>Mode</th><th>Status</th><th>Chairperson</th><th>Candidates</th><th>Invitation</th><th>Documents</th><th>Action</th></tr></thead><tbody id="sacBody"></tbody></table></div><div id="sacMobileCards" class="sac-mobile-list"></div></div>'
          if panel_old not in s:
              raise SystemExit('SAC panel target not found')
          s = s.replace(panel_old, panel_new, 1)

          start = s.index("    function renderSac(){")
          end = s.index("    function renderAssessment(){", start)
          new_render = """    function renderSac(){
      const sessions=db.V2_SAC_SESSIONS||[],candidates=db.V2_SAC_CANDIDATES||[];
      document.getElementById('sacSessionsKpi').textContent=sessions.length;
      document.getElementById('sacCandidatesKpi').textContent=candidates.length;
      const final=candidates.filter(x=>/DIRECT_ENTRY|INTERNAL_ASSESSMENT|REJECTED/.test(String(x['Decision']||x['Final Decision']||x['SAC Decision']||'').toUpperCase())).length;
      document.getElementById('sacFinalKpi').textContent=final;
      document.getElementById('sacPendingKpi').textContent=Math.max(0,candidates.length-final);
      const views=sessions.map(s=>{
        const id=s['SAC Session ID']||s['Session ID']||'';
        const sessionCandidates=candidates.filter(c=>(c['SAC Session ID']||c['Session ID'])===id);
        const n=sessionCandidates.length;
        const pending=sessionCandidates.filter(c=>!String(c['Decision']||'').trim()||String(c['Decision']).toUpperCase()==='PENDING').length;
        const min=s['Minutes URL']||'',end=s['Endorsement URL']||'';
        const mode=s['Meeting Mode']||(/TEST/i.test(id)?'TEST':'MANUAL');
        const cal=String(s['Calendar Status']||'NOT_CREATED').toUpperCase();
        const inviteMode=String(s['Invitation Mode']||'DISABLED').toUpperCase();
        const status=String(s['Status']||'DRAFT').toUpperCase();
        const isFinal=/FINAL|CLOSED/.test(status);
        const inviteAction=!isFinal&&cal!=='INVITED'?`<button class=\"ghost\" onclick=\"sendSacInvite('${esc(id)}')\">Send Invite</button>`:'';
        const finalizeAction=!isFinal&&n>0&&pending===0?`<button class=\"primary\" onclick=\"finalizeSacSession('${esc(id)}')\">Finalize & Generate</button>`:(isFinal?'<a class=\"ghost\" href=\"/sac-results.html\">Review & Send Results</a>':pending?`<span class=\"badge amber\">${pending} pending</span>`:'<span class=\"badge blue\">Assign candidates</span>');
        const documents=min||end?`${min?`<a class=\"link\" target=\"_blank\" href=\"${esc(min)}\">Minutes</a>`:''}${min&&end?' · ':''}${end?`<a class=\"link\" target=\"_blank\" href=\"${esc(end)}\">Endorsement</a>`:''}`:'-';
        return {s,id,n,pending,mode,cal,inviteMode,status,inviteAction,finalizeAction,documents};
      });
      document.getElementById('sacBody').innerHTML=views.map(v=>`<tr><td><div class=\"student\">${esc(v.s['SAC Name']||v.id||'-')}</div><div class=\"subline\">${esc(v.id)}</div></td><td>${esc([v.s['Meeting Date'],v.s['Meeting Time']].filter(Boolean).join(' · ')||'-')}</td><td><span class=\"badge purple\">${esc(pretty(v.mode))}</span><div class=\"subline\">Portal OFF</div></td><td><span class=\"badge ${classifyBadge(v.status)}\">${esc(pretty(v.status))}</span></td><td>${esc(v.s['Chairperson']||'-')}</td><td>${v.n}<div class=\"subline\">${v.pending} pending</div></td><td><span class=\"badge ${v.cal==='INVITED'?'green':'amber'}\">${esc(pretty(v.cal))}</span><div class=\"subline\">Mode: ${esc(pretty(v.inviteMode))}</div>${v.inviteAction?`<div style=\"margin-top:7px\">${v.inviteAction}</div>`:''}</td><td>${v.documents}</td><td>${v.finalizeAction}</td></tr>`).join('')||'<tr><td colspan=\"9\" class=\"empty\">No SAC sessions yet. Create the first Phase 1 manual SAC session above.</td></tr>';
      const mobile=document.getElementById('sacMobileCards');
      if(mobile) mobile.innerHTML=views.map(v=>`<article class=\"sac-mobile-card\"><div class=\"sac-mobile-head\"><div><div class=\"sac-mobile-title\">${esc(v.s['SAC Name']||v.id||'-')}</div><div class=\"sac-mobile-id\">${esc(v.id)}</div></div><span class=\"badge ${classifyBadge(v.status)}\">${esc(pretty(v.status))}</span></div><div class=\"sac-mobile-meta\">${esc([v.s['Meeting Date'],v.s['Meeting Time']].filter(Boolean).join(' · ')||'Date / time not set')} · ${esc(pretty(v.mode))} · Portal OFF</div><div class=\"sac-mobile-grid\"><div class=\"sac-mobile-field\"><div class=\"label\">Chairperson</div><div class=\"value\">${esc(v.s['Chairperson']||'-')}</div></div><div class=\"sac-mobile-field\"><div class=\"label\">Candidates</div><div class=\"value\">${v.n} candidate${v.n===1?'':'s'} · ${v.pending} pending</div></div><div class=\"sac-mobile-field\"><div class=\"label\">Invitation</div><div class=\"value\">${esc(pretty(v.cal))}<br><span class=\"subline\">Mode: ${esc(pretty(v.inviteMode))}</span></div></div><div class=\"sac-mobile-field\"><div class=\"label\">Documents</div><div class=\"value\">${v.documents}</div></div></div><div class=\"sac-mobile-actions\">${v.inviteAction}${v.finalizeAction}</div></article>`).join('')||'<div class=\"empty\">No SAC sessions yet.</div>';
    }
"""
          s = s[:start] + new_render + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Sanity checks
        run: |
          grep -q 'id="sacMobileCards"' admin.html
          grep -q 'sac-mobile-card' admin.html
          grep -q 'sac-desktop-table' admin.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Make SAC monitoring mobile friendly"
          git push origin main
