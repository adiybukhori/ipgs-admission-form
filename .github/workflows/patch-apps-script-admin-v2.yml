name: Patch Apps Script Admin V2 Routes

on:
  push:
    branches: [apps-script-v2-dev]
    paths:
      - '.github/scripts/patch_apps_script_admin_v2.py'
      - '.github/workflows/patch-apps-script-admin-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
      - name: Patch Apps Script V2 routes
        run: python3 .github/scripts/patch_apps_script_admin_v2.py
      - name: Commit patched Apps Script V2 files
        run: |
          git config user.name 'adiybukhori'
          git config user.email 'muhammadadiy93@gmail.com'
          git add apps-script-v2/Code.js apps-script-v2/WorkflowV2.js
          if git diff --cached --quiet; then
            echo 'No Apps Script changes required.'
          else
            git commit -m 'Enable protected Admin V2 document review and screening routes'
            git push origin apps-script-v2-dev
          fi
