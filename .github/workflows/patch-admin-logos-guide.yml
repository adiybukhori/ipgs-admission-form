name: Patch Admin Sidebar Logos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-logos-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch sidebar branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text()
          old = '      <div class="side-brand"><div class="small">IUC · IPGS</div><div class="title">Admission<br/>Command Center</div></div>'
          new = '''      <div class="side-brand">
                <div class="brand-logos" aria-label="IUC and IPGS">
                  <div class="logo-box"><img src="https://lh3.googleusercontent.com/d/135uWJ59t0Gs5fey1Ef7548V-HBWsOiCk=s1000" alt="Innovative University College logo"></div>
                  <div class="logo-box"><img src="https://lh3.googleusercontent.com/d/1iKsYwAVivYw9uRl2kLzt0LcKK7CAJPvd=s1000" alt="Institute of Postgraduate Studies logo"></div>
                </div>
                <div class="small">IUC · IPGS</div>
                <div class="title">Admission<br/>Command Center</div>
              </div>'''
          if 'aria-label="IUC and IPGS"' not in s:
              if old not in s:
                  raise SystemExit('Expected sidebar brand markup not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'adiybukhori'
          git config user.email 'muhammadadiy93@gmail.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'Sidebar already patched.'
          else
            git commit -m 'Show IUC and IPGS logos in Admin V2 sidebar'
            git push origin main
          fi
