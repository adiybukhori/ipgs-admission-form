name: Polish Phase 2 Admission UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-phase2-ui.yml'
      - 'tools/polish_phase2_ui.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Phase 2 UI patch
        run: python tools/polish_phase2_ui.py

      - name: Validate patched admin UI
        run: |
          grep -q 'PHASE2_MOBILE_POLISH_V2' admin.html
          grep -q 'Submit Screening Decision' admin.html
          grep -q 'manualDocProgress' admin.html
          grep -q 'renderOfferAcceptanceTab' admin.html
          grep -q 'acceptance-demo.html' admin.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish Phase 2 mobile review and acceptance UI"
          git push origin main
