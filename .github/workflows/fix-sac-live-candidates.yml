name: Fix SAC Live Participant Loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sac-live-candidates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch admin data SAC candidate fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/admin-data.js')
          s=p.read_text(encoding='utf-8')
          if "const ADMIN_BRIDGE = 'https://anasbukhori.app.n8n.cloud/webhook/iuc-admission-v2-admin-bridge';" not in s:
              s=s.replace("const AUTH_WEB_APP = 'https://script.google.com/macros/s/AKfycbw22-UOsHkaap3dzU16aOjA6XFr7jWGr9qQPfp8F1CQrXboP7YdRZJKKJhHijC3us4/exec';",
                          "const AUTH_WEB_APP = 'https://script.google.com/macros/s/AKfycbw22-UOsHkaap3dzU16aOjA6XFr7jWGr9qQPfp8F1CQrXboP7YdRZJKKJhHijC3us4/exec';\nconst ADMIN_BRIDGE = 'https://anasbukhori.app.n8n.cloud/webhook/iuc-admission-v2-admin-bridge';")
          if 'async function fetchLiveSacCandidates' not in s:
              anchor='async function fetchLegacyMasterSheet() {'
              helper=r'''async function fetchLiveSacCandidates(password) {
  const response = await fetch(ADMIN_BRIDGE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      password: String(password || ''),
      action: 'v2ListSacCandidates',
      data: {},
      updatedBy: 'Admin Data Live SAC Fallback'
    }),
    redirect: 'follow'
  });
  const text = await response.text();
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (_) { throw new Error(`SAC live fallback returned HTTP ${response.status}.`); }
  if (!response.ok || !parsed || parsed.ok === false) throw new Error(parsed?.message || `SAC live fallback returned HTTP ${response.status}.`);
  const payload = parsed?.result?.result || parsed?.result || parsed;
  return Array.isArray(payload?.candidates) ? payload.candidates : [];
}

'''
              if anchor not in s: raise SystemExit('admin-data helper anchor missing')
              s=s.replace(anchor,helper+anchor,1)
          marker='  // V1 has been migrated into the unified V2 operational tables.'
          if 'LIVE_SAC_CANDIDATE_FALLBACK_V1' not in s:
              block=r'''  // LIVE_SAC_CANDIDATE_FALLBACK_V1
  // Google GViz may briefly return an empty SAC candidate tab even when the
  // operational sheet already contains rows. When that happens, obtain the
  // authoritative candidate records from the protected Apps Script backend.
  if (Array.isArray(data.V2_SAC_SESSIONS) && data.V2_SAC_SESSIONS.length &&
      (!Array.isArray(data.V2_SAC_CANDIDATES) || data.V2_SAC_CANDIDATES.length === 0)) {
    try {
      const liveCandidates = await fetchLiveSacCandidates(body.password);
      if (liveCandidates.length) {
        data.V2_SAC_CANDIDATES = liveCandidates;
        if (ADMIN_DATA_CACHE.v2) ADMIN_DATA_CACHE.v2.V2_SAC_CANDIDATES = cloneCached(liveCandidates);
      }
    } catch (error) {
      warnings.push(`V2_SAC_CANDIDATES live fallback: ${error?.message || 'Unable to load'}`);
    }
  }

'''
              if marker not in s: raise SystemExit('admin-data insertion anchor missing')
              s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate main patch
        run: |
          node --check api/admin-data.js
          grep -q "LIVE_SAC_CANDIDATE_FALLBACK_V1" api/admin-data.js

      - name: Commit main patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin-data.js
          git diff --cached --quiet || git commit -m "Load SAC participants from authoritative backend fallback"
          git push origin main

  patch-apps-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0

      - name: Add live SAC candidate list action
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps-script-v2/SacPackV2.js')
          s=p.read_text(encoding='utf-8')
          if 'function v2ListSacCandidates_' not in s:
              s += r'''

function v2ListSacCandidates_() {
  assertDevIdentity_();
  const candidates = v2Rows_('V2_SAC_CANDIDATES').map(function(row) {
    const out = {};
    Object.keys(row || {}).forEach(function(key) { out[key] = row[key]; });
    return out;
  });
  return {ok:true,candidateCount:candidates.length,candidates:candidates,v1Touched:false};
}
'''
              p.write_text(s,encoding='utf-8')

          p=Path('apps-script-v2/WorkflowV2.js')
          s=p.read_text(encoding='utf-8')
          anchor="  if (action === 'v2GetSacPackFile') return v2GetSacPackFile_(payload.data || {});"
          line="  if (action === 'v2ListSacCandidates') return v2ListSacCandidates_();"
          if line not in s:
              if anchor not in s: raise SystemExit('workflow SAC dispatch anchor missing')
              s=s.replace(anchor,anchor+'\n'+line,1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Validate Apps Script patch
        run: |
          node --check apps-script-v2/SacPackV2.js
          node --check apps-script-v2/WorkflowV2.js

      - name: Commit Apps Script patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script-v2/SacPackV2.js apps-script-v2/WorkflowV2.js
          git diff --cached --quiet || git commit -m "Expose authoritative SAC candidate list"
          git push origin apps-script-v2-dev

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify and deploy Apps Script
        run: |
          node tools/verify-clasp-target.mjs
          clasp push --force
          clasp create-deployment --deploymentId "AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB" --description "Authoritative SAC participant loading"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.clasprc.json"
