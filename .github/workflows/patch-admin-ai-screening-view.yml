name: Patch Admin AI Screening View

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_admin_ai_screening_view.py'
      - '.github/workflows/patch-admin-ai-screening-view.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Admin AI screening view
        run: python3 .github/scripts/patch_admin_ai_screening_view.py
      - name: Commit and push
        run: |
          git config user.name 'adiybukhori'
          git config user.email 'muhammadadiy93@gmail.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No Admin AI screening view changes required.'
          else
            git commit -m 'Show provider-agnostic AI screening in Admin portal'
            git push origin main
          fi
