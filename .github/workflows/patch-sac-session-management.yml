name: Patch SAC Session Management

on:
  push:
    branches: [apps-script-v2-dev]
    paths:
      - '.github/workflows/patch-sac-session-management.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0

      - name: Patch SAC session backend
        run: python3 tools/patch-sac-session-backend.py

      - name: Validate Apps Script JavaScript
        run: |
          node --check apps-script-v2/SacManualPhase1V2.js
          node --check apps-script-v2/WorkflowV2.js

      - name: Commit patched backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script-v2/SacManualPhase1V2.js apps-script-v2/WorkflowV2.js
          if git diff --cached --quiet; then
            echo "No backend source changes required."
          else
            git commit -m "Add SAC session detail and panel update action"
            git push origin apps-script-v2-dev
          fi

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify target and redeploy existing V2 app
        env:
          V2_DEPLOYMENT_ID: AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB
        run: |
          node tools/verify-clasp-target.mjs
          clasp push --force
          clasp create-deployment --deploymentId "$V2_DEPLOYMENT_ID" --description "Admission V2 SAC session workspace management"

      - name: Cleanup clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"
