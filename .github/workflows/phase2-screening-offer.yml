name: Phase 2 Screening and Offer Patch

on:
  push:
    branches:
      - apps-script-v2-dev
    paths:
      - '.github/workflows/phase2-screening-offer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0
      - name: Apply Phase 2 patch
        run: python .github/scripts/phase2_screening_offer.py
      - name: Syntax validate Apps Script
        run: |
          set -e
          node --check apps-script-v2/WorkflowV2.js
          node --check apps-script-v2/DocumentReviewV2.js
          node --check apps-script-v2/AIScreeningV2.js
          node --check apps-script-v2/OfferLetterV2.js
          grep -q 'v2CompleteManualQualificationScreening' apps-script-v2/WorkflowV2.js
          grep -q 'V2_AI_AUTO_AND_MANUAL_SECOND_LAYER_V1' apps-script-v2/AIScreeningV2.js
          grep -q 'V2_OFFER_ACCEPTANCE_E2E_V1' apps-script-v2/OfferLetterV2.js
      - name: Commit backend changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script-v2/WorkflowV2.js apps-script-v2/DocumentReviewV2.js apps-script-v2/AIScreeningV2.js apps-script-v2/OfferLetterV2.js
          git diff --cached --quiet && exit 0
          git commit -m "Add manual fallback AI screening and offer acceptance flow"
          git push origin apps-script-v2-dev
