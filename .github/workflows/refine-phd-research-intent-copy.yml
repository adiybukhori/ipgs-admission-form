name: Refine PhD Research Intent Copy

on:
  push:
    paths:
      - '.github/workflows/refine-phd-research-intent-copy.yml'

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Simplify student-facing PhD copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''A preliminary Research Intent (approximately 2–3 pages) is required before your admission file can proceed to SAC. If you already have it, you may upload it in the Document Upload section. <strong>If you do not have it yet, you may still submit this application now.</strong> We will email you a secure link to upload it later.'''
          new = '''For PhD applications, please prepare a preliminary Research Intent (approximately 2–3 pages). If it is ready, you may upload it in the Document Upload section. <strong>If it is not ready yet, you may still submit your application and provide the document later.</strong> This document is required to complete your application assessment.'''

          if old not in s:
              raise SystemExit('Expected PhD notice copy not found.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate copy
        run: |
          grep -q 'For PhD applications, please prepare a preliminary Research Intent' index.html
          ! grep -q 'before your admission file can proceed to SAC' index.html

      - name: Commit refined copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Simplify PhD Research Intent student wording'
            git push origin HEAD:main
          fi
