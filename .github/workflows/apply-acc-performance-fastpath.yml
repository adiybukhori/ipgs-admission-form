name: Apply ACC Performance Fastpath
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_acc_performance_fastpath.py'
      - '.github/workflows/apply-acc-performance-fastpath.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply performance patch
        run: python scripts/patch_acc_performance_fastpath.py
      - name: Commit patched admin
        run: |
          if git diff --quiet -- admin.html; then
            echo 'No admin.html changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Optimize ACC save and refresh performance'
          git push
