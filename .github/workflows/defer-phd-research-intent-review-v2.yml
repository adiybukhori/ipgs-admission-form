name: Deploy PhD Research Intent Outstanding Flow

on:
  push:
    branches:
      - apps-script-v2-dev
    paths:
      - '.github/workflows/defer-phd-research-intent-review-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apps Script branch
        uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0

      - name: Save patch script
        run: cp tools/defer-phd-research-intent-review.py /tmp/defer-phd-review.py

      - name: Patch and push Admin UI
        run: |
          git checkout -B main origin/main
          python /tmp/defer-phd-review.py admin
          grep -F 'Outstanding - submit later' admin.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if ! git diff --cached --quiet; then
            git commit -m 'Allow deferred PhD Research Intent in document review UI'
            git push origin HEAD:main
          fi

      - name: Patch and push Apps Script backend
        run: |
          git checkout -B apps-script-v2-dev origin/apps-script-v2-dev
          python /tmp/defer-phd-review.py backend
          node --check apps-script-v2/DocumentReviewV2.js
          node --check apps-script-v2/ManualDocumentReviewV2.js
          node --check apps-script-v2/WorkflowV2.js
          grep -F 'Outstanding Documents JSON' apps-script-v2/DocumentReviewV2.js
          grep -F 'OUTSTANDING is only allowed for Preliminary Research Intent' apps-script-v2/ManualDocumentReviewV2.js
          grep -F 'before assigning this applicant to SAC' apps-script-v2/WorkflowV2.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script-v2/DocumentReviewV2.js apps-script-v2/ManualDocumentReviewV2.js apps-script-v2/WorkflowV2.js
          if ! git diff --cached --quiet; then
            git commit -m 'Defer PhD Research Intent until SAC assignment'
            git push origin HEAD:apps-script-v2-dev
          fi

      - name: Verify clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo 'CLASPRC_JSON secret is not configured.'
            exit 1
          fi

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify locked V2 target
        run: node tools/verify-clasp-target.mjs

      - name: Push Apps Script source
        run: clasp push -f

      - name: Redeploy V2 web app
        env:
          V2_DEPLOYMENT_ID: AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB
        run: clasp create-deployment --deploymentId "$V2_DEPLOYMENT_ID" --description "Research Intent outstanding through screening; mandatory before SAC"

      - name: Remove clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"
