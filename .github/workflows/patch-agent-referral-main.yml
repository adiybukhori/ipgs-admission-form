name: Patch Agent Referral Form

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-agent-referral-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch referral attribution
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Referral query value.
          anchor = '    const INTERNATIONAL_HEALTH_FORM_URL = "https://drive.google.com/uc?export=download&id=1P7VUusSZLuj4sSMLFzotO2mip-zNltDK";\n'
          insert = anchor + '''    const AGENT_REFERRAL_CODE = String(new URLSearchParams(window.location.search).get("agent") || "").trim().toUpperCase().replace(/[^A-Z0-9_-]/g, "");\n'''
          if 'const AGENT_REFERRAL_CODE' not in s:
              if anchor not in s: raise SystemExit('Referral constant anchor not found')
              s = s.replace(anchor, insert, 1)

          # Initial form state and reset state preserve referral attribution.
          s = s.replace('      referralSource: "",\n      partnerCode: "",', '      referralSource: AGENT_REFERRAL_CODE ? "Education Consultant" : "",\n      partnerCode: AGENT_REFERRAL_CODE,', 1)
          s = s.replace('        referralSource: "",\n        partnerCode: "",', '        referralSource: AGENT_REFERRAL_CODE ? "Education Consultant" : "",\n        partnerCode: AGENT_REFERRAL_CODE,', 1)

          # Public consultant loader. This also fixes the previously missing loader.
          anchor = '''    function getFilteredPartnerCodes(query) {\n'''
          loader = '''    async function loadPartnerCodes() {\n      const applyAgents = (items) => {\n        PARTNER_CODES = Array.isArray(items) ? items.filter(item => item && item.code) : [];\n        if (AGENT_REFERRAL_CODE) {\n          formState.referralSource = "Education Consultant";\n          formState.partnerCode = AGENT_REFERRAL_CODE;\n          if (!isValidPartnerCode(AGENT_REFERRAL_CODE)) {\n            setStatus('info', 'This Academic Consultant referral link is invalid or inactive. Please contact IPGS Registry.');\n          }\n        }\n        render();\n      };\n\n      try {\n        if (typeof google !== 'undefined' && google.script && google.script.run) {\n          google.script.run\n            .withSuccessHandler(res => applyAgents(res && res.agents ? res.agents : []))\n            .withFailureHandler(() => applyAgents([]))\n            .v2PublicAgents();\n          return;\n        }\n        const res = await fetch('/api/agents', { cache: 'no-store' });\n        const out = await res.json();\n        if (!res.ok || !out.ok) throw new Error(out.message || 'Unable to load consultants.');\n        applyAgents(out.agents || []);\n      } catch (_) {\n        applyAgents([]);\n      }\n    }\n\n'''
          if 'async function loadPartnerCodes()' not in s:
              if anchor not in s: raise SystemExit('Partner loader anchor not found')
              s = s.replace(anchor, loader + anchor, 1)

          # Locked referral display. Candidate cannot switch the consultant on a consultant-specific link.
          old = '''          <div class="field"><label>How did you hear about us / Referral Source<span class="required">*</span></label><select data-field="referralSource">${selectOptions(REFERRAL_SOURCES, "Select referral source", formState.referralSource)}</select></div>\n          ${isPartnerFlow() ? `\n'''
          new = '''          ${AGENT_REFERRAL_CODE ? `\n            <div class="info-box">\n              <strong>Academic Consultant</strong><br>\n              ${escapeHtml(getPartnerDisplayValue(AGENT_REFERRAL_CODE))}\n              <div class="hint">This application is linked to the Academic Consultant referral link used to open this form.</div>\n            </div>\n          ` : `<div class="field"><label>How did you hear about us / Referral Source<span class="required">*</span></label><select data-field="referralSource">${selectOptions(REFERRAL_SOURCES, "Select referral source", formState.referralSource)}</select></div>`}\n          ${isPartnerFlow() && !AGENT_REFERRAL_CODE ? `\n'''
          if old not in s: raise SystemExit('Referral UI anchor not found')
          s = s.replace(old, new, 1)

          # Review shows code + consultant name when available.
          s = s.replace('    ? `${formState.referralSource} (${formState.partnerCode})`', '    ? `${formState.referralSource} (${getPartnerDisplayValue(formState.partnerCode)})`', 1)

          p.write_text(s, encoding='utf-8')

      - name: Sanity checks
        run: |
          grep -q 'const AGENT_REFERRAL_CODE' index.html
          grep -q 'async function loadPartnerCodes' index.html
          grep -q 'This application is linked to the Academic Consultant referral link' index.html
          grep -q "fetch('/api/agents'" index.html

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Auto-attribute consultant referral links in admission form"
          git push origin main
