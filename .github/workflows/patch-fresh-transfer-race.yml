name: Patch admission race and transfer applicant

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-fresh-transfer-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Admission Form V2
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_races = '"Indian Muslim", "Chinese Muslim","Jakun"'
          new_races = '"Indian Muslim", "Chinese", "Chinese Muslim","Jakun"'
          if old_races not in s:
              raise SystemExit('RACES anchor not found; refusing to patch.')
          s = s.replace(old_races, new_races, 1)

          state_pattern = re.compile(r'(?m)^(\s*)entryQualificationType: "",\n\1proposedSupervisor: "",')
          def add_entry_type(match):
              indent = match.group(1)
              return indent + 'entryQualificationType: "",\n' + indent + 'applicationCategory: "",\n' + indent + 'proposedSupervisor: "",'
          s, state_count = state_pattern.subn(add_entry_type, s)
          if state_count != 2:
              raise SystemExit(f'Expected 2 state definitions, found {state_count}; refusing to patch.')

          ui_anchor = '          ${internationalBlock}\n\n          <div class="field"><label>Level of Study <span class="required">*</span></label>'
          ui_replacement = '          ${internationalBlock}\n\n          <div class="field">\n            <label>Admission Entry Type <span class="required">*</span></label>\n            <select data-field="applicationCategory">\n              ${selectOptions(["Fresh Student", "Transfer Student"], "Select admission entry type", formState.applicationCategory)}\n            </select>\n            <div class="hint">Select Transfer Student if you are currently or previously enrolled in another institution/programme and are applying to transfer your study, credits or research progress to IUC.</div>\n          </div>\n\n          <div class="field"><label>Level of Study <span class="required">*</span></label>'
          if ui_anchor not in s:
              raise SystemExit('Programme Selection UI anchor not found; refusing to patch.')
          s = s.replace(ui_anchor, ui_replacement, 1)

          validation_anchor = '      !formState.studyMode ||\n      !formState.entryQualificationType\n    ) {'
          validation_replacement = '      !formState.studyMode ||\n      !formState.entryQualificationType ||\n      !formState.applicationCategory\n    ) {'
          if validation_anchor not in s:
              raise SystemExit('Step 1 validation anchor not found; refusing to patch.')
          s = s.replace(validation_anchor, validation_replacement, 1)

          review_anchor = '          <p><strong>Applicant Type:</strong> ${escapeHtml(formState.applicantType || \'-\')}</p>\n          <p><strong>Level of Study:</strong>'
          review_replacement = '          <p><strong>Applicant Type:</strong> ${escapeHtml(formState.applicantType || \'-\')}</p>\n          <p><strong>Admission Entry Type:</strong> ${escapeHtml(formState.applicationCategory || \'-\')}</p>\n          <p><strong>Level of Study:</strong>'
          if review_anchor not in s:
              raise SystemExit('Review summary anchor not found; refusing to patch.')
          s = s.replace(review_anchor, review_replacement, 1)

          payload_anchor = '      const payload = JSON.parse(JSON.stringify(formState));\n      payload.documents = documents;'
          payload_replacement = '      const payload = JSON.parse(JSON.stringify(formState));\n      payload.transferApplicant = formState.applicationCategory === \'Transfer Student\';\n      payload.documents = documents;'
          if payload_anchor not in s:
              raise SystemExit('Payload anchor not found; refusing to patch.')
          s = s.replace(payload_anchor, payload_replacement, 1)

          p.write_text(s, encoding='utf-8')

      - name: Sanity check
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
              '"Chinese", "Chinese Muslim"',
              'applicationCategory: ""',
              'Admission Entry Type',
              'Fresh Student',
              'Transfer Student',
              "payload.transferApplicant = formState.applicationCategory === 'Transfer Student';",
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit('Sanity check failed: ' + ', '.join(missing))
          if s.count('applicationCategory: ""') != 2:
              raise SystemExit('State/reset applicationCategory count is not 2.')

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-fresh-transfer-race.yml
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Chinese race and fresh transfer applicant selection"
          git push origin main
