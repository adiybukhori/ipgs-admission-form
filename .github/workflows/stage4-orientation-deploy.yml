name: Stage 4 Orientation Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage4-orientation-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Admin Stage 4
        run: |
          node --check orientation-admin.js
          node --check api/admin-action.js
          node --check api/admin-data.js
          grep -F 'Create Orientation Session' admin.html
          grep -F 'v2AssignOrientationBatch' api/admin-action.js

      - name: Checkout Apps Script branch
        run: |
          git fetch origin apps-script-v2-dev
          git checkout -B apps-script-v2-dev origin/apps-script-v2-dev

      - name: Validate Orientation backend
        run: |
          node --check apps-script-v2/OrientationV2.js
          node --check apps-script-v2/WorkflowV2.js
          grep -F 'v2OrientationReminderSweep' apps-script-v2/OrientationV2.js
          grep -F 'v2CreateOrientationSession' apps-script-v2/WorkflowV2.js

      - name: Verify clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo 'CLASPRC_JSON secret is not configured.' && exit 1)

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify locked V2 target
        run: node tools/verify-clasp-target.mjs

      - name: Push Apps Script source
        run: clasp push -f

      - name: Redeploy existing V2 web app
        env:
          V2_DEPLOYMENT_ID: AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB
        run: clasp create-deployment --deploymentId "$V2_DEPLOYMENT_ID" --description "Stage 4 orientation sessions, invitations, reminders and attendance"

      - name: Remove clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"