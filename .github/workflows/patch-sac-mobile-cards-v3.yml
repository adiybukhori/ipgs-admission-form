name: Patch SAC mobile cards v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sac-mobile-cards-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch mobile SAC layout
        shell: python
        run: |
          import base64
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          dec=lambda x: base64.b64decode(x).decode('utf-8')
          css_anchor='    .guide-badge.blue{background:var(--blueSoft);color:var(--blue)}\n\n    @media(max-width:1100px)'
          css_insert=dec('')
          mobile_old=dec('')
          mobile_new=dec('')
          panel_old=dec('')
          panel_new=dec('')
          new_render=dec('')
          if css_anchor not in s or mobile_old not in s or panel_old not in s:
              raise SystemExit('Expected admin targets not found; refusing to patch')
          s=s.replace(css_anchor,css_insert,1).replace(mobile_old,mobile_new,1).replace(panel_old,panel_new,1)
          start=s.index('    function renderSac(){')
          end=s.index('    function renderAssessment(){',start)
          s=s[:start]+new_render+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Sanity checks
        run: |
          grep -q 'id="sacMobileCards"' admin.html
          grep -q 'sac-mobile-card' admin.html
          grep -q 'sac-desktop-table' admin.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Make SAC monitoring mobile friendly"
          git push origin main
