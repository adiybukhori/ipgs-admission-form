name: Probe Auth Web App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-auth-webapp.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe routes
        shell: bash
        run: |
          set -e
          URL='https://script.google.com/macros/s/AKfycbw22-UOsHkaap3dzU16aOjA6XFr7jWGr9qQPfp8F1CQrXboP7YdRZJKKJhHijC3us4/exec'
          for q in 'action=applications' 'action=v2Bootstrap' 'action=health'; do
            echo "--- $q ---"
            curl -sS -L "$URL?$q" | tail -c 1600
            echo
          done
