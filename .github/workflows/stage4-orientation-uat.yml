name: Stage 4 Orientation UAT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage4-orientation-uat.yml'

permissions:
  contents: write

jobs:
  uat:
    runs-on: ubuntu-latest
    env:
      V2_DEPLOYMENT_ID: AKfycbxasT_HgtRSvTbR_bsa8p17Cm-C2PKn20Ok1kU-AyJmxiKX8kX5EGOtRLwVwNlAL7JB
    steps:
      - name: Checkout Apps Script V2 branch
        uses: actions/checkout@v4
        with:
          ref: apps-script-v2-dev
          fetch-depth: 0

      - name: Validate Stage 4 UAT runner
        run: |
          node --check apps-script-v2/OrientationV2.js
          grep -F 'function v2RunStage4Uat()' apps-script-v2/OrientationV2.js

      - name: Verify clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo 'CLASPRC_JSON secret is not configured.' && exit 1)

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restore clasp credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push and deploy clean Stage 4 source
        run: |
          node tools/verify-clasp-target.mjs
          clasp push -f
          clasp create-deployment --deploymentId "$V2_DEPLOYMENT_ID" --description "Stage 4 controlled UAT execution build"

      - name: Verify deployed execution API target
        id: ping
        shell: bash
        run: |
          set +e
          clasp run v2ExecutionPing --nondev >/tmp/stage4-ping.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] && grep -F '1O-Y-q7_q78xKM1p5e2C3EWyQfYr5rXvhO0oWbVaw5Mw' /tmp/stage4-ping.txt >/dev/null; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute controlled Stage 4 UAT
        if: steps.ping.outputs.status == 'PASS'
        id: run_uat
        shell: bash
        run: |
          set +e
          clasp run v2RunStage4Uat --nondev >/tmp/stage4-uat.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] && grep -F '"uat":"PASS"' /tmp/stage4-uat.txt >/dev/null; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Record verified UAT result
        if: always()
        shell: bash
        run: |
          ping_status="${{ steps.ping.outputs.status }}"
          uat_status="${{ steps.run_uat.outputs.status }}"
          [ -n "$ping_status" ] || ping_status="FAIL"
          [ -n "$uat_status" ] || uat_status="NOT_RUN"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p uat
          python - <<'PY'
          import json, re
          from pathlib import Path

          def safe_preview(path):
              p=Path(path)
              if not p.exists():
                  return ''
              s=p.read_text(errors='replace')[:1200]
              s=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[EMAIL_REDACTED]', s)
              s=re.sub(r'(?i)(access_token|refresh_token|id_token|client_secret)[^\s<>"&]*', '[TOKEN_REDACTED]', s)
              return s

          uat={}
          raw=Path('/tmp/stage4-uat.txt')
          if raw.exists():
              try:
                  uat=json.loads(raw.read_text())
              except Exception:
                  uat={}

          result={
              'pingStatus':'${{ steps.ping.outputs.status }}' or 'FAIL',
              'pingExitCode':'${{ steps.ping.outputs.exit_code }}',
              'uatStatus':'${{ steps.run_uat.outputs.status }}' or 'NOT_RUN',
              'uatExitCode':'${{ steps.run_uat.outputs.exit_code }}',
              'ok':bool(uat.get('ok')),
              'stage':uat.get('stage'),
              'uat':uat.get('uat'),
              'referenceNo':uat.get('referenceNo',''),
              'sessionId':uat.get('sessionId',''),
              'reminderAutomation':uat.get('reminderAutomation',''),
              'invitationStatus':uat.get('invitationStatus',''),
              'attendanceStatus':uat.get('attendanceStatus',''),
              'academicHandoverStatus':uat.get('academicHandoverStatus',''),
              'sessionStatus':uat.get('sessionStatus',''),
              'pingPreview':safe_preview('/tmp/stage4-ping.txt'),
              'uatPreview':safe_preview('/tmp/stage4-uat.txt')
          }
          Path('/tmp/stage4-result.json').write_text(json.dumps(result,indent=2))
          PY
          {
            echo "Stage 4 Orientation UAT"
            echo "Executed: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Execution path: Apps Script Execution API (--nondev)"
            echo
            cat /tmp/stage4-result.json
          } > uat/stage4-orientation-latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uat/stage4-orientation-latest.txt
          git commit -m "Record Stage 4 nondev UAT result" || true
          git push origin main

      - name: Fail if Stage 4 UAT did not pass
        if: steps.ping.outputs.status != 'PASS' || steps.run_uat.outputs.status != 'PASS'
        run: |
          echo "Stage 4 UAT not verified."
          cat /tmp/stage4-result.json 2>/dev/null || true
          exit 1

      - name: Remove clasp credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"
