name: Publish IPGS Orientation Poster High Resolution
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ipgs-orientation-highres.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve official orientation poster
        env:
          SOURCE_IMAGE_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-7b60-8246-bbd5-4c6b5a4be8c5/raw?se=2026-10-15T02%3A30%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=98184c89-3eb0-5a3c-9da0-8dc448ed64cc&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T02%3A20%3A26Z&ske=2026-10-16T02%3A20%3A26Z&sks=b&skv=2026-02-06&sig=dLDqgwfkQ1QHiYSjMN4GEi5DGgKPpGsadoKy4XIvdbQ%3D'
        run: |
          mkdir -p assets/email
          curl --fail --location --silent --show-error --retry 3 "$SOURCE_IMAGE_URL" --output assets/email/Postgraduate_Orientation_17Oct2026_HighRes.jpg
          test "$(wc -c < assets/email/Postgraduate_Orientation_17Oct2026_HighRes.jpg)" -gt 100000
          file assets/email/Postgraduate_Orientation_17Oct2026_HighRes.jpg | grep -q JPEG
      - name: Publish poster asset only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/email/Postgraduate_Orientation_17Oct2026_HighRes.jpg
          git commit -m "Add clear full-size 17 Oct IPGS orientation poster for email"
          git push
