name: Deploy Document Quality Human Override UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/document-quality-human-override-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply human override UI patch
        run: python3 tools/patch-document-quality-human-override-ui.py

      - name: Validate Admin UI
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('admin.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          for(const block of blocks)new Function(block);
          if(!html.includes('Human Override → Next Stage')) throw new Error('Override button missing');
          if(!html.includes('APPROVED_TO_PROCEED')) throw new Error('Override decision payload missing');
          if(!html.includes('v2ListOpenHumanTasks')) throw new Error('Human task lookup missing');
          console.log('DOCUMENT_QUALITY_OVERRIDE_UI_OK');
          NODE

      - name: Commit UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then
            echo "UI already patched."
          else
            git commit -m "Add governed document quality human override UI"
            git push origin main
          fi
