name: Admission Submission Success State

on:
  push:
    paths:
      - '.github/workflows/admission-success-terminal-state.yml'

permissions:
  contents: write

jobs:
  patch-success-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch success state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            '    let currentStep = 0;\n    let submitting = false;',
            '    let currentStep = 0;\n    let submitting = false;\n    let submissionCompleted = false;'
          )

          old_render = '''      backBtn.disabled = currentStep === 0 || submitting;\n      nextBtn.classList.toggle('hidden', currentStep === STEPS.length - 1);\n      submitBtn.classList.toggle('hidden', currentStep !== STEPS.length - 1);\n      nextBtn.disabled = submitting;\n      submitBtn.disabled = submitting;\n      resetBtn.disabled = submitting;'''
          new_render = '''      backBtn.classList.toggle('hidden', submissionCompleted);\n      resetBtn.classList.toggle('hidden', submissionCompleted);\n      nextBtn.classList.toggle('hidden', submissionCompleted || currentStep === STEPS.length - 1);\n      submitBtn.classList.toggle('hidden', submissionCompleted || currentStep !== STEPS.length - 1);\n      backBtn.disabled = currentStep === 0 || submitting || submissionCompleted;\n      nextBtn.disabled = submitting || submissionCompleted;\n      submitBtn.disabled = submitting || submissionCompleted;\n      resetBtn.disabled = submitting || submissionCompleted;'''
          if old_render not in s:
              raise SystemExit('render navigation block not found')
          s = s.replace(old_render, new_render, 1)

          anchor = '''    async function submitForm(evt) {'''
          helper = '''    function showSubmissionSuccess(reference) {\n      submissionCompleted = true;\n      submitting = false;\n      setStatus('success', `\n        <div class="submit-progress-wrap">\n          <div><strong>Application submitted successfully.</strong></div>\n          <div style="margin-top:8px">Reference: <strong>${escapeHtml(reference || '-')}</strong></div>\n          <div class="small" style="margin-top:14px;line-height:1.6">Please check your email for confirmation and further information. A Registry Office officer will contact you regarding the next step.</div>\n          <div class="submit-progress-track">\n            <div class="submit-progress-fill done"></div>\n          </div>\n        </div>\n      `);\n      render();\n      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });\n    }\n\n'''
          if helper not in s:
              if anchor not in s:
                  raise SystemExit('submitForm anchor not found')
              s = s.replace(anchor, helper + anchor, 1)

          old_google = '''              setStatus('success', `Application submitted successfully.<br>Reference: <strong>${escapeHtml(result.reference || '-')}</strong>`);\n              formEl.reset();\n              resetFormState();\n              submitting = false;\n              render();\n              setStatus('success', `Application submitted successfully.<br>Reference: <strong>${escapeHtml(result.reference || '-')}</strong>`);\n              window.scrollTo({ top: 0, behavior: 'smooth' });'''
          new_google = '''              showSubmissionSuccess(result.reference || '-');'''
          if old_google not in s:
              raise SystemExit('Google success block not found')
          s = s.replace(old_google, new_google, 1)

          old_fetch = '''        formEl.reset();\n        resetFormState();\n        setStatus('success', `\n          <div class="submit-progress-wrap">\n            <div><strong>Application submitted successfully.</strong></div>\n            <div>Reference: <strong>${escapeHtml(json.reference || '-')}</strong></div>\n            <div class="submit-progress-track">\n              <div class="submit-progress-fill done"></div>\n            </div>\n          </div>\n        `);'''
          new_fetch = '''        showSubmissionSuccess(json.reference || '-');'''
          if old_fetch not in s:
              raise SystemExit('Fetch success block not found')
          s = s.replace(old_fetch, new_fetch, 1)

          old_finally = '''      } finally {\n        submitting = false;\n        render();\n      }'''
          new_finally = '''      } finally {\n        submitting = false;\n        render();\n      }'''
          # Kept intentionally; render respects submissionCompleted.
          if old_finally not in s:
              raise SystemExit('finally block not found')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate terminal state
        run: |
          grep -q 'let submissionCompleted = false' index.html
          grep -q "backBtn.classList.toggle('hidden', submissionCompleted)" index.html
          grep -q 'Please check your email for confirmation and further information' index.html
          grep -q 'showSubmissionSuccess(result.reference' index.html
          grep -q 'showSubmissionSuccess(json.reference' index.html

      - name: Commit frontend update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Hide form actions after successful admission submission'
            git push origin HEAD:main
          fi
