<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IUC · Campus RPG V9</title><link rel="stylesheet" href="campus-v9/style.css"></head><body>
<header><div class="crest">IUC</div><div><small>IPGS · ADMISSIONS OPERATIONS</small><h1>Campus <span>V9</span></h1></div><div class="metrics" id="metrics"></div><button id="mode" class="badge">Simulation</button></header>
<main><canvas id="campus" aria-label="Interactive admissions campus. Drag to pan, wheel to zoom. Select applicants using the roster." tabindex="0"></canvas><div id="loading">Opening the campus…</div>
<nav class="toolbar"><button id="pause">Ⅱ Pause</button><button id="add">＋ Applicant</button><button id="sac">Convene SAC</button><button id="orientation">Start orientation</button><select id="speed" aria-label="Simulation speed"><option value="1">1× pace</option><option value="2">2× pace</option><option value="4">4× pace</option></select><button id="reset">Reset</button></nav>
<aside id="hud"><div class="hud-head"><span>OPERATIONS</span><button id="hide">−</button></div><div id="selection"></div><details open><summary>Applicants <span id="count"></span></summary><div id="roster"></div></details><details><summary>Activity stream</summary><div id="activity"></div></details><details><summary>Admission V2 · read-only</summary><p>Load a current snapshot. Simulation controls are disabled for real records. No records are modified.</p><form id="liveForm"><input id="password" type="password" autocomplete="off" placeholder="Admin password" aria-label="Admin password" required><button>Load snapshot</button></form><button id="demo">Return to simulation</button><p id="liveMessage"></p></details></aside>
<button id="showHud" hidden>Show operations</button><div class="camera-controls"><button id="follow">◎ Follow selected</button><button id="map">▧ Full map</button><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">＋</button></div><div class="hint">Drag to explore · Scroll to zoom · Click a student or room</div><div id="toast" role="status"></div></main><script type="module" src="campus-v9/main.js"></script></body></html>
